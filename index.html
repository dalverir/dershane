function tcUret(n){const d=String(100000000+(n*7919)%899999999).slice(0,9).split('').map(Number);if(!d[0])d[0]=1;const t10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7-(d[1]+d[3]+d[5]+d[7]))%10+10)%10;d.push(t10);d.push(d.reduce((a,b)=>a+b,0)%10);return d.join('')}
function tcSahibi(tc,haric){if(!tc)return null;const e=Object.entries(S.kisisel||{}).find(([k,v])=>v&&v.tc===tc&&k!==haric);return e?e[0]:null}
function tcHata(tc,haric){if(!tc)return '';if(!tcGecerli(tc))return 'TC kimlik numarası geçersiz. 11 haneyi kontrol et.';const s=tcSahibi(tc,haric);if(s){let ad=s;try{ad=keyAd(s).split(' · ')[0]}catch(e){}return 'Bu TC kimlik numarası zaten kayıtlı: '+ad}return ''}
const tcAlan=(v,k)=>field('TC kimlik no',`<input name="tc" value="${esc(v||'')}" inputmode="numeric" maxlength="11" autocomplete="off" data-tc="${esc(k||'')}"><div class="tcuyari small" style="color:var(--bad)"></div>`);

/* doğum günü */
const dgAd=dg=>{if(!dg)return '';const [m,g]=dg.split('-').map(Number);return g+' '+AYLAR[m-1]};
function dgKalan(dg){if(!dg||!/^\d\d-\d\d$/.test(dg))return null;const y=+TODAY.slice(0,4);const [m,g]=dg.split('-').map(Number);
  const tar=yy=>{let gg=g;if(m===2&&g===29&&!((yy%4===0&&yy%100!==0)||yy%400===0))gg=28;return `${yy}-${String(m).padStart(2,'0')}-${String(gg).padStart(2,'0')}`};
  let t=tar(y);if(t<TODAY)t=tar(y+1);return daysBetween(TODAY,t)}
function yas(dogum){if(!dogum)return '';const [y,m,g]=dogum.split('-').map(Number);const [ty,tm,tg]=TODAY.split('-').map(Number);return ty-y-((tm<m||(tm===m&&tg<g))?1:0)}
function personelDg(){const L=S.ogretmenler.filter(t=>t.dg).map(t=>({k:ogtKey(t),ad:t.ad,dg:t.dg,alt:t.rehber?'Rehber':t.brans}));
  Object.entries(S.ayarlar.dgYon||{}).forEach(([k,dg])=>{if(dg)L.push({k,ad:yonAd(k),dg,alt:'Yönetim'})});return L}
function benimDg(){const [r,i]=ME().split(':');if(r==='yonetici')return (S.ayarlar.dgYon||{})[ME()];if(r==='ogrenci')return ogr(i).dg;if(r==='ogretmen'||r==='rehber'){const t=S.ogretmenler.find(x=>x.id===i);return t&&t.dg}return null}
function kutlama(ad,siz){return `<div class="card dg-kart dg-buyuk"><span class="dg-e" aria-hidden="true">🎉</span><div><h2 style="margin:0">İyi ki doğdun${siz?'uz':''}, ${esc(ad)}!</h2><p style="margin:4px 0 0">${esc(S.ayarlar.kurum)} ailesi olarak doğum gününü kutlar, ${siz?'sağlıklı ve mutlu bir yaş dileriz.':'yeni yaşında bütün hedeflerine ulaşmanı dileriz.'} 🎂</p></div></div>`}
function dgKutu(){const r=O.role;
  if(r==='ogrenci'){const o=ogr(O.id);return o.dg&&dgKalan(o.dg)===0?kutlama(o.ad.split(' ')[0]):''}
  if(r==='veli')return veli(O.id).cocuklar.map(ogr).filter(o=>o&&o.dg&&dgKalan(o.dg)===0&&S.ogrenciler.some(x=>x.id===o.id)).map(o=>`<div class="card dg-kart"><span class="dg-e" aria-hidden="true">🎂</span><div><b>Doğum günü kutlu olsun, ${esc(o.ad.split(' ')[0])}!</b><p class="small muted" style="margin:2px 0 0">${esc(S.ayarlar.kurum)} ailesi olarak nice mutlu yıllar dileriz.</p></div></div>`).join('');
  const bd=benimDg();let h=bd&&dgKalan(bd)===0?kutlama(benAd().split(' ')[0],true):'';
  let ogs=S.ogrenciler;if(r==='ogretmen'){const subs=new Set(S.dersler.filter(d=>d.ogretmenId===O.id).map(d=>d.subeId));ogs=ogs.filter(o=>subs.has(o.subeId))}
  const L=[...ogs.filter(o=>o.dg).map(o=>({k:'ogrenci:'+o.id,ad:o.ad,dg:o.dg,alt:sube(o.subeId).ad})),...personelDg().filter(x=>!benim(x.k))]
    .map(x=>({...x,n:dgKalan(x.dg)})).filter(x=>x.n!=null&&x.n<=7).sort((a,b)=>a.n-b.n||a.ad.localeCompare(b.ad,'tr'));
  if(L.length){let ks;try{ks=new Set(kisiler())}catch(e){ks=new Set()}
    h+=`<div class="card"><h2>🎂 Doğum günleri · önümüzdeki 7 gün</h2><table>${L.map(x=>`<tr><td><b>${esc(x.ad)}</b> <span class="small muted">${esc(x.alt)}</span></td><td>${x.n===0?'<span class="tag acc">Bugün</span>':x.n===1?'Yarın':`${esc(dgAd(x.dg))} <span class="small muted">· ${x.n} gün sonra</span>`}</td><td class="num">${x.n===0&&ks.has(x.k)?`<button class="btn sm" data-act="dg-mesaj" data-k="${esc(x.k)}">Kutla</button>`:''}</td></tr>`).join('')}</table></div>`}
  return h}

/* öğretmen sözleşmesi */
function sozlesmeYaklasan(){return S.ogretmenler.map(t=>({t,b:KS(ogtKK(t.id)).sozBit})).filter(x=>x.b&&daysBetween(TODAY,x.b)<=30&&daysBetween(TODAY,x.b)>=-60).sort((a,b)=>a.b<b.b?-1:1)}
const sozTag=b=>{if(!b)return '';const n=daysBetween(TODAY,b);return n<0?`<span class="tag bad">${-n} gün önce bitti</span>`:n===0?'<span class="tag bad">Bugün bitiyor</span>':n<=30?`<span class="tag ${n<=7?'bad':'n'}">${n} gün kaldı</span>`:''};
function sozlesmeKutu(){if(O.role!=='yonetici')return '';const l=sozlesmeYaklasan();if(!l.length)return '';
  return `<div class="card"><div class="between"><h2 style="margin:0">Sözleşmesi biten ya da bitmek üzere olan öğretmenler</h2><a href="#" class="small" data-act="go" data-page="kurum">Öğretmenler</a></div><table style="margin-top:8px">${l.map(({t,b})=>`<tr><td><b>${esc(t.ad)}</b> <span class="small muted">${esc(t.brans)}</span></td><td>${fd(b)}</td><td>${sozTag(b)}</td><td class="num"><button class="btn sm" data-act="ogt-duzenle" data-id="${t.id}">Uzat / düzenle</button></td></tr>`).join('')}</table></div>`}
function otoHatirlat(){if(O.role!=='yonetici')return false;let ch=false;sozlesmeYaklasan().forEach(({t,b})=>{const n=daysBetween(TODAY,b);if(n<0)return;const id='soz_'+t.id+'_'+b+'_'+ME();
  if(!S.bildirimler.some(x=>x.id===id)){S.bildirimler.push({id,kime:ME(),zaman:nowTime(),metin:`${t.ad} (${t.brans}) öğretmenin sözleşmesi ${fd(b)} tarihinde bitiyor (${n} gün kaldı).`});ch=true}});return ch}
['panel','bugun','rpanel','oana','vana'].forEach(p=>{const f=PAGES[p];if(!f)return;PAGES[p]=a=>{const h=f(a);let ek='';try{if(p==='panel'&&otoHatirlat())save();ek=dgKutu()+(p==='panel'?sozlesmeKutu():'')}catch(e){hataKaydet('dg: '+e.message)}return ek?h.replace('<!--/h-->','<!--/h-->'+ek):h}});

/* ücret: toplam → indirim → peşinat → taksit */
function indirimTutar(b,toplam){if(!b||!b.tur)return 0;if(b.tutar!=null&&b.tutar!=='')return Math.min(toplam,Math.max(0,Math.round(+b.tutar||0)));return Math.min(toplam,Math.round(toplam*(+b.oran||0)/100))}
const bursEtiket=b=>b&&b.tur?`${b.tur} · ${b.tutar!=null&&b.tutar!==''?tl(b.tutar):'%'+b.oran}`:'';
function ucret(id){const tk=S.taksitler.filter(t=>t.ogrId===id).sort((a,b)=>a.vade<b.vade?-1:a.vade>b.vade?1:(b.pesinat?1:0)-(a.pesinat?1:0));
  const odenen=tk.filter(t=>t.odendi).reduce((a,t)=>a+(+t.tutar||0),0);const planli=tk.reduce((a,t)=>a+(+t.tutar||0),0);const u=(S.ucretler||{})[id];
  if(u&&u.toplam!=null){const ind=Math.min(+u.toplam||0,+u.indirim||0);const net=Math.max(0,(+u.toplam||0)-ind);return {u,toplam:+u.toplam||0,indirim:ind,indirimAd:u.indirimAd||'',net,odenen,kalan:Math.max(0,net-odenen),planDisi:net-planli,tk}}
  const toplam=tk.reduce((a,t)=>a+(+(t.liste||t.tutar)||0),0);return {u:null,toplam,indirim:toplam-planli,indirimAd:bursEtiket(S.burslar[id]),net:planli,odenen,kalan:Math.max(0,planli-odenen),planDisi:0,tk}}
function ucretBelirle(id,toplam){const b=S.burslar[id];toplam=Math.max(0,Math.round(+toplam||0));if(!S.ucretler)S.ucretler={};const e=S.ucretler[id];
  S.ucretler[id]={toplam,indirim:indirimTutar(b,toplam),...(b&&b.tur?{indirimAd:bursEtiket(b)}:{}),tarih:(e&&e.tarih)||TODAY}}
function ayEkle(s,n){const [y,m,g]=s.split('-').map(Number);const t=new Date(y,m-1+n,1,12);const son=new Date(t.getFullYear(),t.getMonth()+1,0,12).getDate();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(Math.min(g,son)).padStart(2,'0')}`}
const ilkVade=()=>ayEkle(TODAY.slice(0,8)+'15',1);
function dagit(kalan,adet){adet=Math.floor(+adet||0);kalan=Math.round(+kalan||0);if(adet<=0||kalan<=0)return [];let b=Math.floor(kalan/adet);if(adet>1&&b>=100)b=Math.floor(b/10)*10;const l=new Array(adet).fill(b);l[0]+=kalan-b*adet;return l}
function taksitlendir(id,p){const x=ucret(id);S.taksitler=S.taksitler.filter(t=>!(t.ogrId===id&&!t.odendi));let kalan=Math.max(0,x.net-x.odenen);
  const pes=Math.min(Math.max(0,Math.round(+p.pesinat||0)),kalan);const alindi=p.psekil&&p.psekil!=='sonra';
  if(pes>0){S.taksitler.push({id:uid()+uid(),ogrId:id,vade:TODAY,tutar:pes,pesinat:true,odendi:alindi?TODAY:null,...(alindi?{sekil:p.psekil}:{})});kalan-=pes}
  const l=dagit(kalan,Math.min(36,+p.adet||0));const ilk=p.ilk||ilkVade();l.forEach((t,i)=>S.taksitler.push({id:uid()+uid(),ogrId:id,vade:ayEkle(ilk,i),tutar:t,odendi:null}));
  return {pes,adet:l.length,kalan:kalan-l.reduce((a,b)=>a+b,0)}}
function yenidenDagit(id){const x=ucret(id);const ac=x.tk.filter(t=>!t.odendi);if(!ac.length)return 0;const kalan=Math.max(0,x.net-x.odenen);
  if(kalan<=0){S.taksitler=S.taksitler.filter(t=>!(t.ogrId===id&&!t.odendi));return ac.length}
  const l=dagit(kalan,ac.length);ac.forEach((t,i)=>{t.tutar=l[i];delete t.liste});return ac.length}
const yenidenChk=id=>{const n=S.taksitler.filter(t=>t.ogrId===id&&!t.odendi).length;return n?`<label class="chk" style="margin:4px 0 12px"><input type="checkbox" name="yeniden" checked> Ödenmemiş ${n} taksiti yeni tutara göre yeniden hesapla</label><br>`:''};
const ucretAlan=(b={},toplam='',p={})=>`<div class="ucret-kutu"><h3 class="fh" style="margin-top:0">Ücret</h3>${field('Toplam fiyat (₺)',`<input type="number" name="toplam" min="0" step="1" value="${toplam}" placeholder="Örn. 48000">`,'İndirimden önceki fiyat')}${bursAlan(b,'İndirim yap')}
  <details class="field"${p.adet?' open':''}><summary>Taksitlendir</summary><div class="fields" style="margin-top:8px">${field('Peşinat (₺)',`<input type="number" name="pesinat" min="0" placeholder="0">`)}${field('Peşinat ödemesi',`<select name="psekil">${opt('nakit','Bugün alındı · Nakit','nakit')}${opt('kart','Bugün alındı · Kart','')}${opt('sonra','Henüz alınmadı','')}</select>`)}</div>
  <div class="fields">${field('Taksit sayısı',`<input type="number" name="adet" min="0" max="36" placeholder="Örn. 8" value="${p.adet||''}">`)}${field('İlk taksit tarihi',`<input type="date" name="ilk" value="${p.ilk||ilkVade()}">`,'Sonrakiler her ay aynı gün')}</div></details>
  <div class="ucret-oz small" data-ucret-oz></div></div>`;
function ucretOnizle(f){const el=f&&f.querySelector('[data-ucret-oz]');if(!el)return;const q=n=>{const i=f.querySelector(`[name="${n}"]`);return i?i.value:null};
  const odenen=+f.dataset.odenen||0;let net,ind=0,toplam=null;
  if(f.dataset.kalan!=null)net=(+f.dataset.kalan||0)+odenen;
  else{toplam=q('toplam')!=null?(+q('toplam')||0):(+f.dataset.toplam||0);let b=null;
    if(q('bursTur')!=null)b=q('bursTur')?{tur:q('bursTur'),...(q('bursOran')==='tutar'?{tutar:+q('bursTutar')||0}:{oran:+q('bursOran')||0})}:null;else{try{b=JSON.parse(f.dataset.burs||'null')}catch(e){}}
    ind=indirimTutar(b,toplam);net=toplam-ind}
  const kal=Math.max(0,net-odenen);const pes=Math.min(kal,Math.max(0,+(q('pesinat')||0)));const adet=+(q('adet')||0);const l=dagit(kal-pes,adet);const p=[];
  if(toplam!=null){if(!toplam){el.innerHTML='<span class="muted">Toplam fiyatı yazınca özet burada görünür.</span>';return}p.push(`Toplam <b>${tl(toplam)}</b>`);if(ind)p.push(`İndirim <b>−${tl(ind)}</b>`);p.push(`Net <b>${tl(net)}</b>`)}
  if(odenen)p.push(`Ödenen <b>${tl(odenen)}</b>`);if(odenen||toplam==null)p.push(`Kalan <b>${tl(kal)}</b>`);if(pes)p.push(`Peşinat <b>${tl(pes)}</b>`);
  if(q('adet')!=null){if(l.length)p.push(`<b>${l.length} taksit</b>: ${l.length>1&&l[0]!==l[1]?tl(l[0])+' + '+(l.length-1)+' × '+tl(l[1]):l.length+' × '+tl(l[0])}`);else if(kal-pes>0)p.push(`<span class="muted">${tl(kal-pes)} taksitlendirilmedi</span>`)}
  el.innerHTML=p.join(' · ')}
function ucretKart(id){const x=ucret(id);const b=S.burslar[id];const ar=!S.ogrenciler.some(o=>o.id===id);const yuz=x.net?Math.round(x.odenen/x.net*100):0;const gec=x.tk.filter(t=>!t.odendi&&t.vade<TODAY);let n=0;
  return `<div class="card" style="margin:16px 0"><div class="between"><h2 style="margin:0">Ücret</h2><div class="row">${ar?'':`<button class="btn sm" data-act="ucret-fiyat" data-id="${id}">${x.toplam?'Fiyatı değiştir':'Toplam fiyat gir'}</button><button class="btn sm" data-act="ucret-indirim" data-id="${id}">İndirim yap</button><button class="btn sm" data-act="ucret-taksit" data-id="${id}">Taksitlendir</button>`}<button class="btn sm" data-act="sozlesme" data-id="${id}">Kayıt sözleşmesi</button></div></div>
  ${x.toplam||x.tk.length?`<div class="stats" style="margin:12px 0 8px">${stat('Toplam fiyat',tl(x.toplam))}${stat('İndirim',x.indirim?tl(x.indirim):'—',esc(b?bursEtiket(b):x.indirimAd)+(b&&b.not?' · '+esc(b.not):''))}${stat('Ödenen',tl(x.odenen),'%'+yuz)}${stat('Kalan',tl(x.kalan),gec.length?`<span style="color:var(--bad)">${gec.length} taksit gecikti</span>`:'')}</div><div class="bar"><i style="width:${Math.min(100,yuz)}%"></i></div>
  ${x.planDisi>0.5?`<p class="note" style="margin-top:10px">${tl(x.planDisi)} henüz taksitlendirilmedi. <a href="#" data-act="ucret-taksit" data-id="${id}">Taksitlendir</a></p>`:''}${x.planDisi<-0.5?`<p class="note" style="margin-top:10px">Taksitlerin toplamı net ücretten ${tl(-x.planDisi)} fazla. “Taksitlendir” ile yeniden düzenleyebilirsin.</p>`:''}
  <details style="margin-top:10px"${x.tk.length&&x.tk.length<=2?' open':''}><summary class="small">Taksitler (${x.tk.length})</summary><div class="tw"><table>${x.tk.map(t=>`<tr><td>${t.pesinat?'<b>Peşinat</b>':(++n)+'. taksit'}</td><td>${fd(t.vade)}</td><td class="num">${t.liste&&t.liste!==t.tutar?`<s class="muted small">${tl(t.liste)}</s> `:''}${tl(t.tutar)}</td><td>${t.odendi?`<span class="tag ok">Ödendi · ${t.sekil==='kart'?'Kart':'Nakit'} · ${fds(t.odendi)}</span>`:t.vade<TODAY?`<span class="tag bad">${daysBetween(t.vade,TODAY)} gün gecikti</span>`:'<span class="tag n">Bekliyor</span>'}</td><td class="num">${t.odendi?`<button class="btn sm" data-act="odendi" data-id="${t.id}">Düzenle</button>`:`<div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm" data-act="odendi" data-id="${t.id}" data-v="nakit">Nakit</button><button class="btn sm" data-act="odendi" data-id="${t.id}" data-v="kart">Kart</button></div>`}</td></tr>`).join('')||`<tr><td>${empty(b&&+b.oran===100?'Tam burslu':'Taksit yok')}</td></tr>`}</table></div></details>`:empty('Ücret bilgisi girilmemiş. “Toplam fiyat gir” ile başla.')}</div>`}
function planModal(id){const x=id?ucret(id):null;
  modal('Ücret ve taksit planı',`<form data-form="plan" data-ucret${x?` data-odenen="${x.odenen}"`:''}>${field('Öğrenci',ogrSel('ogrId',id).replace('<select ','<select data-chg="plan-ogr" '))}${id?`${x.odenen?`<p class="note">Bu öğrenciden ${tl(x.odenen)} tahsil edildi; ödenmiş taksitler korunur, ödenmemişler yeni plana göre yeniden oluşturulur.</p>`:''}${(()=>{const ac=x.tk.filter(t=>!t.odendi&&!t.pesinat);return ucretAlan(S.burslar[id]||{},x.toplam||'',{adet:ac.length||'',ilk:ac[0]&&ac[0].vade})})()}<button class="btn primary" type="submit">Kaydet</button>`:'<p class="small muted">Önce öğrenciyi seç.</p>'}</form>`);
  if(id)ucretOnizle($('#modal-box form'))}
