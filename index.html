<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dershane · Test Sürümü</title>
<style>
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --line:#E2E0DA; --line2:#ECEAE5;
  --text:#1C1F24; --muted:#666A71; --accent:#1F3A5F; --accent-weak:#E9EEF4;
  --ok:#2C6A44; --ok-bg:#E6F1EA; --warn:#8A520F; --warn-bg:#FBF0DF; --bad:#9C3326; --bad-bg:#F8E5E1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px;font-weight:650}
h3{font-size:15px;margin:0 0 8px;font-weight:650}
p{margin:0 0 8px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:650;color:var(--muted);margin-bottom:6px}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:650}
.badge{font-size:11px;font-weight:650;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:2px}
.who{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted)}
.wrap{display:flex;min-height:calc(100vh - 54px)}
.side{width:210px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:14.5px}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.side .cnt{font-size:12px;background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;line-height:18px}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}
main{flex:1;padding:26px 30px 60px;max-width:1120px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.card.flush{padding:0}
.card.flush > h2{padding:16px 18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2 > .card,.grid3 > .card{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .n{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#C9C6BE}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#18304F}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.link:hover{color:var(--text);text-decoration:underline}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFAF8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.n{background:var(--bg);color:var(--muted)}
.tag.acc{background:var(--accent-weak);color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:#3B3F46}
input,select,textarea{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--text);width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.field{margin-bottom:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.inline-sel{width:auto;padding:5px 8px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.yk button{border:1px solid var(--line);background:#fff;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;border-radius:5px;color:var(--muted)}
.yk button.on.var{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.yk button.on.gec{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.yk button.on.yok{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.scale{display:flex;gap:6px}
.scale label{margin:0}
.scale input{display:none}
.scale span{display:inline-block;width:42px;height:38px;line-height:36px;text-align:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:600;background:#fff}
.scale input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.big{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.note{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font-size:13.5px;color:#4A4E55}
.msg-wrap{display:grid;grid-template-columns:260px 1fr;min-height:460px}
.msg-list{border-right:1px solid var(--line);overflow-y:auto;max-height:620px}
.msg-list a{display:block;padding:10px 14px;border-bottom:1px solid var(--line2);text-decoration:none;color:var(--text)}
.msg-list a.on{background:var(--accent-weak)}
.msg-list a span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column}
.bubbles{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:520px}
.bub{max-width:75%;padding:8px 12px;border-radius:8px;background:var(--bg);font-size:14.5px}
.bub.me{align-self:flex-end;background:var(--accent-weak)}
.bub time{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.composer textarea{min-height:42px}
.login{min-height:100vh;display:flex;justify-content:center;padding:48px 20px}
.login-in{width:100%;max-width:860px}
.login h2{margin-top:26px;font-size:14px;color:var(--muted);font-weight:650;letter-spacing:.02em}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pick{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit}
.pick:hover{border-color:var(--accent)}
.pick b{display:block;font-weight:600;font-size:14.5px}
.pick span{font-size:12.5px;color:var(--muted)}
.banner{background:#FFFBF2;border:1px solid #EFE3C8;color:#6B5320;border-radius:6px;padding:9px 12px;font-size:13.5px;margin-bottom:18px}
.modal{position:fixed;inset:0;background:rgba(20,24,30,.35);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:20;overflow-y:auto}
.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:10px;border:1px solid var(--line);width:100%;max-width:560px;padding:20px 22px}
.modal-box .between{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.week td,.week th{text-align:left;vertical-align:top}
.slot{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:13.5px;background:#fff}
.slot b{display:block;font-weight:600}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slotbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:118px;text-align:left}
.slotbtn small{display:block;color:var(--muted);font-size:12px}
.slotbtn:hover{border-color:var(--accent)}
.slotbtn.full{background:var(--bg);color:var(--muted);cursor:default}
.slotbtn.mine{border-color:var(--accent);background:var(--accent-weak)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.back{display:inline-block;margin-bottom:10px;font-size:14px;text-decoration:none}
details summary{cursor:pointer;font-weight:600;font-size:14px}
#print-area{display:none}
@media print{#app,#modal,#toast{display:none!important}#print-area{display:block}body{background:#fff;font-size:13px}.pk{page-break-after:always;padding:6mm 4mm}.pk:last-child{page-break-after:auto}.bar>i,.tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pt{width:100%;border-collapse:collapse}.pt td,.pt th{border:1px solid #ddd;padding:4px 6px}}
@media (max-width:820px){
  .wrap{display:block}
  .side{width:auto;flex-direction:row;overflow-x:auto;white-space:nowrap;border-right:none;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:54px;z-index:4}
  .side a{flex:none}
  .side-foot{display:none}
  main{padding:18px 14px 60px}
  .grid2,.grid3,.fields{grid-template-columns:1fr}
  .msg-wrap{grid-template-columns:1fr}
  .msg-list{border-right:none;border-bottom:1px solid var(--line);max-height:220px}
  .who span{display:none}
  .kv{grid-template-columns:120px 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast"></div>
<div id="print-area"></div>
<input type="file" id="file-in" accept="application/json" style="display:none">
<script>
'use strict';
/* =====================================================================
   SUNUCU AYARI  ·  KURULUM.md 5. adımda burayı dolduracağız.
   İkisi de boşsa site "demo modunda" çalışır (veriler sadece tarayıcıda).
   ===================================================================== */
const SUNUCU = {
  url: '',      // örnek: 'https://abcdefgh.supabase.co'
  anahtar: ''   // Publishable key (sb_publishable_...) ya da anon key
};
const ONLINE=!!(SUNUCU.url&&SUNUCU.anahtar);
const EPOSTA=k=>`${k}@dershane.example.com`;
let sb=null,SNAP={},syncT=null,syncing=false,syncAgain=false,sonYukleme=0,PROFIL=null,HESAPLAR=null,girisHata='',KURULUMSUZ=false,DURUM='';

/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=s=>new Date(s+'T12:00:00');
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>D(s).getDay();
const AY=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const fd=s=>{if(!s)return '';const d=D(s);return `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}`};
const fds=s=>{if(!s)return '';const d=D(s);return `${d.getDate()} ${AY[d.getMonth()]}`};
const weekStart=s=>{const w=wd(s);return addDays(s,w===0?-6:1-w)};
const daysBetween=(a,b)=>Math.round((D(b)-D(a))/864e5);
const tl=n=>Number(n).toLocaleString('tr-TR')+' ₺';
const nf=n=>(Math.round(n*100)/100).toLocaleString('tr-TR',{maximumFractionDigits:2});
const nowTime=()=>{const d=new Date();return `${TODAY}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const ftime=t=>{if(!t)return '';const [g,h]=t.split('T');return (g===TODAY?'Bugün':fds(g))+(h?' '+h:'')};
const lower=s=>String(s).toLocaleLowerCase('tr');

const TUR={
  TYT:{ad:'TYT',kademe:'YKS',f:4,dersler:[['Türkçe',40],['Sosyal',20],['Matematik',40],['Fen',20]]},
  'AYT-SAY':{ad:'AYT Sayısal',kademe:'YKS',f:4,dersler:[['Matematik',40],['Fizik',14],['Kimya',13],['Biyoloji',13]]},
  'AYT-EA':{ad:'AYT Eşit Ağırlık',kademe:'YKS',f:4,dersler:[['Matematik',40],['Edebiyat',24],['Tarih-1',10],['Coğrafya-1',6]]},
  'AYT-SOZ':{ad:'AYT Sözel',kademe:'YKS',f:4,dersler:[['Edebiyat',24],['Tarih-1',10],['Coğrafya-1',6],['Tarih-2',11],['Coğrafya-2',11],['Felsefe',12],['Din',6]]},
  YDT:{ad:'YDT (Yabancı Dil)',kademe:'YKS',f:4,dersler:[['Yabancı Dil',80]]},
  LGS:{ad:'LGS',kademe:'LGS',f:3,dersler:[['Türkçe',20],['Matematik',20],['Fen',20],['İnkılap',10],['Din',10],['İngilizce',10]]},
  OZEL:{ad:'Branş / özel deneme',kademe:'',f:4,dersler:[]}
};
const turOf=sn=>sn&&sn.ozel?{ad:'Branş / özel',f:sn.ozel.f,dersler:sn.ozel.dersler}:(TUR[sn&&sn.tur]||TUR.TYT);
const turKey=sn=>sn.ozel?'OZEL:'+sn.ozel.dersler.map(x=>x.join('/')).join(','):sn.tur;
const turAd=sn=>sn.ozel?'Branş':(TUR[sn.tur]||{}).ad||sn.tur;
const dersNet=(r,f)=>r?(r.d-(f?r.y/f:0)):0;
const toplamNet=(s,sn)=>{const t=turOf(sn);return t.dersler.reduce((a,[ad])=>a+dersNet(s.c[ad],t.f),0)};
const ayniTur=(ss,sn)=>ss.filter(x=>turKey(x)===turKey(sn));
function siraHesapla(sn,liste){const rr=liste.filter(r=>r.sinavId===sn.id).map(r=>({r,n:toplamNet(r,sn)})).sort((a,b)=>b.n-a.n);rr.forEach(x=>{x.r.sira=rr.findIndex(y=>y.n<=x.n+1e-9)+1;x.r.katilim=rr.length})}
const bosVeri=()=>({v:1,subeler:[],ogretmenler:[],ogrenciler:[],veliler:[],dersler:[],yoklamalar:[],sinavlar:[],sonuclar:[],taksitler:[],checkinler:[],gorusmeler:[],etutler:[],odevler:[],duyurular:[],mesajlar:[],bildirimler:[],riskler:{},profiller:{},ayarlar:{kurum:'Dershane',yksTarih:`${new Date().getFullYear()+(new Date().getMonth()>=7?1:0)}-06-19`,lgsTarih:`${new Date().getFullYear()+(new Date().getMonth()>=7?1:0)}-06-13`,etutHak:2}});

/* ---------- demo veri ---------- */
function seed(){
  let sd=13;const r=()=>{sd=(sd*16807)%2147483647;return (sd-1)/2147483646};
  const t0=D(TODAY);const yil=t0.getMonth()>=7?t0.getFullYear():t0.getFullYear()-1;
  const subeler=[{id:'s12a',ad:'12-A',kademe:'YKS',alan:'Sayısal'},{id:'s12b',ad:'12-B',kademe:'YKS',alan:'Eşit Ağırlık'},{id:'s8a',ad:'8-A',kademe:'LGS',alan:'LGS'}];
  const ogretmenler=[{id:'t1',ad:'Selin Kaya',brans:'Matematik'},{id:'t2',ad:'Murat Aydın',brans:'Fizik'},{id:'t3',ad:'Derya Şahin',brans:'Türkçe'},{id:'t4',ad:'Kemal Öz',brans:'Kimya'},{id:'t6',ad:'Burak Can',brans:'Fen Bilimleri'},{id:'t5',ad:'Zeynep Arslan',brans:'Rehberlik',rehber:true}];
  const isim=[['Elif','Yıldız','s12a','Bilgisayar Mühendisliği'],['Mert','Demir','s12a','Makine Mühendisliği'],['Ayşe','Kara','s12a','Tıp'],['Berk','Tan','s12a','Elektrik-Elektronik Müh.'],['Defne','Arslan','s12a','Diş Hekimliği'],['Emre','Bulut','s12a','İnşaat Mühendisliği'],['Zeynep','Çelik','s12b','Hukuk'],['Can','Toprak','s12b','İşletme'],['Deniz','Akın','s12b','Psikoloji'],['Selin','Er','s12b','Ekonomi'],['Ozan','Kurt','s12b','Uluslararası İlişkiler'],['İrem','Polat','s12b','Öğretmenlik'],['Can','Yıldız','s8a','Fen Lisesi'],['Ece','Sarı','s8a','Anadolu Lisesi'],['Kaan','Uçar','s8a','Fen Lisesi'],['Nehir','Ateş','s8a','Sosyal Bilimler Lisesi'],['Yusuf','Koç','s8a','Anadolu Lisesi'],['Ada','Güneş','s8a','Fen Lisesi']];
  const vAd=['Ayşe','Hakan','Sevgi','Ali','Gül','Serkan','Nur','Levent','Filiz','Okan','Pınar','Tolga','','Melek','Cem','Aylin','Erdem','Hülya'];
  const ogrenciler=[],veliler=[];
  isim.forEach(([a,s,sb,h],i)=>{const id='o'+(i+1);let vid;
    if(i===12){vid='v1';veliler[0].cocuklar.push(id)}else{vid='v'+(i+1);veliler.push({id:vid,ad:vAd[i]+' '+s,cocuklar:[id]})}
    ogrenciler.push({id,no:String(101+i),ad:a+' '+s,subeId:sb,veliId:vid,hedef:h,kayit:`${yil}-09-01`})});
  const P=[['s12a','t1',1,'09:00','Matematik'],['s12a','t2',1,'11:00','Fizik'],['s12a','t3',2,'09:00','Türkçe'],['s12a','t4',2,'11:00','Kimya'],['s12a','t1',3,'09:00','Matematik'],['s12a','t2',4,'09:00','Fizik'],['s12a','t1',5,'09:00','Matematik'],['s12a','t3',5,'11:00','Türkçe'],
    ['s12b','t3',1,'09:00','Türkçe'],['s12b','t1',1,'11:00','Matematik'],['s12b','t1',2,'09:00','Matematik'],['s12b','t3',3,'11:00','Türkçe'],['s12b','t1',4,'11:00','Matematik'],['s12b','t3',5,'13:00','Türkçe'],
    ['s8a','t1',1,'14:00','Matematik'],['s8a','t6',2,'14:00','Fen Bilimleri'],['s8a','t3',3,'14:00','Türkçe'],['s8a','t6',4,'14:00','Fen Bilimleri'],['s8a','t1',5,'14:00','Matematik']];
  const dersler=P.map(([subeId,ogretmenId,gun,saat,ders],i)=>({id:'d'+(i+1),subeId,ogretmenId,gun,saat,ders}));
  const yoklamalar=[];
  for(let k=18;k>=1;k--){const g=addDays(TODAY,-k);const w=wd(g);
    dersler.filter(d=>d.gun===w).forEach(d=>{const kayit={};

const DIZI=['subeler','ogretmenler','ogrenciler','veliler','dersler','yoklamalar','sinavlar','sonuclar','taksitler','checkinler','etutler','odevler','duyurular','mesajlar','bildirimler'];

function scriptYukle(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Kütüphane yüklenemedi'));document.head.appendChild(s)})}
function durum(t){DURUM=t;const el=$('#durum');if(el)el.textContent=t}
function satir(t,o,id){const r={id:String(id||o.id),veri:o,ogr_id:(o&&o.ogrId)||null,sahip:null,alici:null};
  if(t==='mesajlar'){r.sahip=o.from;r.alici=o.to}if(t==='bildirimler')r.sahip='veli:'+o.veliId;if(t==='riskler'||t==='profiller')r.ogr_id=String(id);return r}
const stab=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
function sunucuSnap(R){
  const M={};const put=(t,r)=>{(M[t]=M[t]||new Map()).set(r.id,stab(r))};
  [...DIZI,'riskler','profiller','ayarlar'].forEach(t=>{M[t]=new Map();R[t].forEach(x=>put(t,satir(t,x.veri,x.id)))});
  if(O.role==='rehber')['gorusmeler','gorusme_ozetleri','veli_notlari'].forEach(t=>{M[t]=new Map();R[t].forEach(x=>put(t,satir(t,x.veri,x.id)))});
  return M;
}
function satirlar(){
  const M={};const put=(t,r)=>{(M[t]=M[t]||new Map()).set(r.id,stab(r))};
  DIZI.forEach(t=>{M[t]=new Map();(S[t]||[]).forEach(o=>put(t,satir(t,o)))});
  ['riskler','profiller'].forEach(t=>{M[t]=new Map();Object.entries(S[t]||{}).forEach(([k,v])=>put(t,satir(t,v,k)))});
  M.ayarlar=new Map();put('ayarlar',satir('ayarlar',S.ayarlar,'genel'));
  if(O&&O.role==='rehber'){M.gorusmeler=new Map();M.gorusme_ozetleri=new Map();M.veli_notlari=new Map();
    S.gorusmeler.forEach(g=>{put('gorusmeler',satir('gorusmeler',g));
      if(g.ozet)put('gorusme_ozetleri',satir('gorusme_ozetleri',{id:g.id,ogrId:g.ogrId,tarih:g.tarih,konu:g.konu,tur:g.tur,rehberId:g.rehberId,ozet:g.ozet}));
      if(g.veliNotu)put('veli_notlari',satir('veli_notlari',{id:g.id,ogrId:g.ogrId,tarih:g.tarih,rehberId:g.rehberId,veliNotu:g.veliNotu}))})}
  return M;
}

async function sync(){
  if(syncing){syncAgain=true;return}syncing=true;durum('Kaydediliyor…');let hata=null;
  try{const now=satirlar();
    for(const t of Object.keys(now)){const a=SNAP[t]||new Map(),b=now[t];const yeni=[],degisen=[],silinen=[];
      b.forEach((j,id)=>{if(!a.has(id))yeni.push(JSON.parse(j));else if(a.get(id)!==j)degisen.push(JSON.parse(j))});a.forEach((j,id)=>{if(!b.has(id))silinen.push(id)});
      let ok=true;
      if(yeni.length){const {error}=await sb.from(t).insert(yeni);if(error){hata=error.message;ok=false}}
      for(const r of degisen){const {data,error}=await sb.from(t).update({veri:r.veri,ogr_id:r.ogr_id,sahip:r.sahip,alici:r.alici,guncelleme:new Date().toISOString()}).eq('id',r.id).select('id');if(error||!data||!data.length){hata=error?error.message:'Bu kaydı değiştirme iznin yok';ok=false}}
      if(silinen.length){const {error}=await sb.from(t).delete().in('id',silinen);if(error){hata=error.message;ok=false}}
      if(ok)SNAP[t]=b}
  }catch(e){hata=e.message}
  syncing=false;
  if(hata){durum('Kaydedilemedi');toast('Kaydedilemedi: '+hata);try{await veriYukle();render()}catch(e){}}else durum('Kaydedildi');
  if(syncAgain){syncAgain=false;sync()}
}

function risk(id){

  if(ch[0]&&ch[0].stres>=5&&daysBetween(ch[0].tarih,TODAY)<=10)sig.push('Yüksek sınav stresi bildirdi');
  if(ch[0]&&ch[0].gorusme&&daysBetween(ch[0].tarih,TODAY)<=10)sig.push('Görüşmek istediğini belirtti');
  const ss0=ogrSinavlar(id);const ss=ss0.length?ayniTur(ss0,ss0[ss0.length-1]):[];if(ss.length>=2){const a=toplamNet(sonucOf(ss[ss.length-2].id,id),ss[ss.length-2]),b=toplamNet(sonucOf(ss[ss.length-1].id,id),ss[ss.length-1]);if(b-a<=-5)sig.push(`Son denemede ${nf(b-a)} net`)}
  const odv=S.odevler.filter(h=>h.subeId===ogr(id).subeId&&h.sonTarih<TODAY);if(odv.length&&odv.filter(h=>h.teslim[id]!=='yapti').length===odv.length&&odv.length>=1&&odv.some(h=>h.teslim[id]==='eksik'))sig.push('Ödevleri eksik');
  const m=S.riskler[id];return {seviye:m?m.seviye:(sig.length?'sari':'yesil'),sig,manuel:!!m,not:m?m.not:''};
}

const head=(t,sub,act='')=>`<div class="head"><div><h1>${t}</h1>${sub?`<p class="muted" style="margin:0">${sub}</p>`:''}</div><div class="row">${act}</div></div>`;
const stat=(l,n,s='')=>`<div class="stat"><div class="l">${l}</div><div class="n">${n}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`;
const field=(l,inner,h='')=>`<div class="field"><label>${l}</label>${inner}${h?`<div class="hint">${h}</div>`:''}</div>`;
const empty=t=>`<p class="empty">${t}</p>`;
function trendSvg(vals,labels){
  if(vals.length<2)return '<p class="empty">Trend için en az iki deneme gerekiyor.</p>';
  const W=640,H=170,pl=36,pr=14,pt=14,pb=28;const mn=Math.floor(Math.min(...vals)-3),mx=Math.ceil(Math.max(...vals)+3);
  const x=i=>pl+i*(W-pl-pr)/(vals.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn||1));
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let g='';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ECEAE5"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" fill="#666A71" text-anchor="end">${Math.round(v)}</text>`}
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3.5}" fill="#1F3A5F"/><text x="${x(i)}" y="${H-8}" font-size="11" fill="#666A71" text-anchor="middle">${esc(labels[i])}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Net trendi">${g}<polyline points="${pts}" fill="none" stroke="#1F3A5F" stroke-width="2.5"/>${dots}</svg>`;
}
function dersBars(sonuc,sn){const t=turOf(sn);return `<table><tr><th>Ders</th><th class="num">D</th><th class="num">Y</th><th class="num">Net</th><th style="width:40%"></th></tr>${t.dersler.map(([ad,q])=>{const r=sonuc.c[ad]||{d:0,y:0};const n=dersNet(r,t.f);return `<tr><td>${ad}</td><td class="num">${r.d}</td><td class="num">${r.y}</td><td class="num"><b>${nf(n)}</b> <span class="muted small">/ ${q}</span></td><td><div class="bar"><i style="width:${Math.max(0,n/q*100)}%"></i></div></td></tr>`}).join('')}</table>`}
function zayifDersler(sonuc,sn){const t=turOf(sn);return t.dersler.map(([ad,q])=>({ad,o:dersNet(sonuc.c[ad],t.f)/q})).sort((a,b)=>a.o-b.o).slice(0,2).map(x=>x.ad)}

function shell(content){
  const ust=ONLINE?`<span id="durum" class="small">${esc(DURUM)}</span><span>${esc(benAd())} · ${ROLAD[O.role]}</span><button class="btn sm" data-act="yenile">Yenile</button><button class="btn sm" data-act="sifrem">Şifrem</button><button class="btn sm" data-act="logout">Çıkış</button>`
    :`<span>${esc(benAd())} · ${ROLAD[O.role]}</span><button class="btn sm" data-act="logout">Rol değiştir</button>`;
  const alt=ONLINE?(O.role==='yonetici'?'<button class="link" data-act="export">Yedek al</button>':'')
    :'<button class="link" data-act="export">Veriyi dışa aktar</button><button class="link" data-act="import">Veriyi içe aktar</button><button class="link" data-act="reset">Demo veriye dön</button>';

  <main>${content}</main></div>`;
}
function render(){
  const app=$('#app');if(!O){app.innerHTML=ONLINE?girisView():loginView();return}

  try{html=pf?pf(arg):empty('Sayfa bulunamadı.')}catch(e){console.error(e);html=`<div class="card">Bir hata oluştu: ${esc(e.message)}</div>`}
  app.innerHTML=shell(html);
  if(AFTER[p])AFTER[p](arg);
}

PAGES.panel=()=>{
  const bd=S.dersler.filter(d=>d.gun===wd(TODAY)).sort((a,b)=>a.saat<b.saat?-1:1);
  const by=S.yoklamalar.filter(y=>y.tarih===TODAY);let yok=0;by.forEach(y=>Object.values(y.kayit).forEach(v=>{if(v==='yok')yok++}));

  const sonDen=S.subeler.map(s=>{const ex=S.sinavlar.filter(x=>x.yayinda&&x.subeler.includes(s.id)).sort((a,b)=>a.tarih<b.tarih?1:-1)[0];if(!ex)return null;const rr=S.sonuclar.filter(r=>r.sinavId===ex.id&&ogr(r.ogrId).subeId===s.id);const avg=rr.length?rr.reduce((a,r)=>a+toplamNet(r,ex),0)/rr.length:0;return {s,ex,avg,n:rr.length}}).filter(Boolean);

};

function ogrDetay(id){
  const o=ogr(id),v=veli(o.veliId),dv=devamsizlik(id),rk=risk(id),ss=ogrSinavlar(id),rol=O.role;
  const ssT=ss.length?ayniTur(ss,ss[ss.length-1]):[];const nets=ssT.map(s=>toplamNet(sonucOf(s.id,id),s));const pr=S.profiller[id]||{};
  const gr=S.gorusmeler.filter(g=>g.ogrId===id).sort((a,b)=>a.tarih<b.tarih?1:-1);
  if(!S.ogrenciler.some(x=>x.id===id))return `<a href="#" class="back" data-act="go" data-page="ogrenciler">← Geri</a>`+empty('Öğrenci bulunamadı.');
  let h=`<a href="#" class="back" data-act="go" data-page="${rol==='rehber'&&O.from==='rpanel'?'rpanel':'ogrenciler'}">← Geri</a>`+head(esc(o.ad),`${sube(o.subeId).ad} · ${sube(o.subeId).alan} · Hedef: ${esc(o.hedef)}`,sevTag(rk.seviye)+(rol==='rehber'?` <button class="btn" data-act="seviye" data-id="${id}">Seviyeyi değiştir</button> <button class="btn primary" data-act="gor-yeni" data-id="${id}">Görüşme ekle</button>`:'')+(rol==='yonetici'?` <button class="btn" data-act="ogr-duzenle" data-id="${id}">Düzenle</button> <button class="btn danger" data-act="ogr-sil" data-id="${id}">Kaydı sil</button>`:''));
  h+=`<div class="grid3"><div class="card"><h3>Öğrenci ve veli</h3><p class="small">${o.no?'No: <b>'+esc(o.no)+'</b> · ':''}Kayıt: ${fd(o.kayit)}</p><p>${esc(v.ad)}${v.tel&&rol!=='ogretmen'?`<br><span class="small muted">${esc(v.tel)}</span>`:''}</p></div>
  <div class="card"><h3>Devam · son 14 gün</h3><p><b>${dv.yok}</b> gelmedi · <b>${dv.gec}</b> geç · ${dv.top} ders</p></div>
  <div class="card"><h3>Rehberlik sinyalleri</h3>${rk.sig.length?`<ul style="margin:0;padding-left:18px">${rk.sig.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:empty('Sinyal yok.')}${rk.manuel?`<p class="small muted" style="margin-top:6px">Seviyeyi rehber belirledi${rk.not?': '+esc(rk.not):''}</p>`:''}</div></div>`;
  h+=`<div class="card" style="margin-top:16px"><h2>Deneme trendi${ssT.length?' · '+esc(turAd(ssT[0])):''}</h2>${trendSvg(nets,ssT.map(s=>s.ad.replace(/^\D+/,'D')))}</div>`;
  if(rol==='rehber'){
    h+=`<div class="grid2"><div class="card"><div class="between"><h2>Tanıma profili</h2><button class="btn sm" data-act="profil" data-id="${id}">Düzenle</button></div><dl class="kv"><dt>Güçlü yanlar</dt><dd>${esc(pr.guclu||'—')}</dd><dt>Gelişim alanları</dt><dd>${esc(pr.gelisim||'—')}</dd><dt>İlgi alanları</dt><dd>${esc(pr.ilgi||'—')}</dd><dt>Ev ortamı</dt><dd>${esc(pr.ev||'—')}</dd><dt>Kaygı düzeyi</dt><dd>${esc(pr.kaygi||'—')}</dd></dl></div>
    <div class="card"><h2>Görüşmeler</h2>${gr.length?gr.map(g=>gorKart(g,true)).join(''):empty('Henüz görüşme yok.')}</div></div>`;
  }else if(rol==='yonetici'){
    const tk=S.taksitler.filter(t=>t.ogrId===id);
    h+=`<div class="grid2"><div class="card"><h2>Taksitler</h2><table>${tk.map(t=>`<tr><td>${fd(t.vade)}</td><td class="num">${tl(t.tutar)}</td><td>${t.odendi?'<span class="tag ok">Ödendi</span>':t.vade<TODAY?'<span class="tag bad">Gecikti</span>':'<span class="tag n">Bekliyor</span>'}</td></tr>`).join('')}</table></div>
    <div class="card"><h2>Rehberlik özetleri</h2><p class="small muted">Sadece rehberin paylaşılabilir olarak işaretlediği özetler görünür.</p>${gr.filter(g=>g.ozet).map(g=>`<p><b>${fds(g.tarih)}</b> · ${esc(g.konu)}: ${esc(g.ozet)}</p>`).join('')||empty('Paylaşılan özet yok.')}</div></div>`;
  }
  return h;
}

  ${ds.map(d=>{const y=S.yoklamalar.find(x=>x.dersId===d.id&&x.tarih===tarih);const c=y?Object.values(y.kayit):[];return `<tr><td>${d.saat}</td><td><b>${sube(d.subeId).ad}</b> · ${esc(d.ders)}</td><td class="muted">${esc(ogt(d.ogretmenId).ad)}</td><td>${y?`<span class="tag ok">Alındı</span> <span class="small muted">${c.filter(v=>v==='yok').length} gelmedi, ${c.filter(v=>v==='gec').length} geç</span>`:'<span class="tag n">Alınmadı</span>'}</td><td class="num"><button class="btn sm ${y?'':'primary'}" data-act="go" data-page="yoklama:${d.id}">${y?'Düzenle':'Yoklama al'}</button></td></tr>`}).join('')||`<tr><td colspan="5">${empty('Bu gün ders yok.')}</td></tr>`}</table></div></div>`;
};
function yokForm(dersId,tarih){
  const d=S.dersler.find(x=>x.id===dersId);if(!d)return empty('Ders bulunamadı.');const y=S.yoklamalar.find(x=>x.dersId===dersId&&x.tarih===tarih);
  const ogs=S.ogrenciler.filter(o=>o.subeId===d.subeId);
  return `<a href="#" class="back" data-act="go" data-page="${O.role==='ogretmen'&&O.from==='bugun'?'bugun':'yoklama'}">← Geri</a>`+head(`${sube(d.subeId).ad} · ${esc(d.ders)}`,`${GUN[wd(tarih)]} ${fd(tarih)}, ${d.saat} · ${ogs.length} öğrenci`,`<button class="btn" data-act="yk-hepsi">Herkes burada</button>`)+
  `<div class="card flush"><table id="yk">${ogs.map(o=>{const st=y?(y.kayit[o.id]||'var'):'var';return `<tr data-ogr="${o.id}" data-st="${st}"><td><b>${esc(o.ad)}</b></td><td class="num yk">${['var','gec','yok'].map(k=>`<button class="${k}${st===k?' on':''}" data-act="yk-set" data-v="${k}">${ST[k][1]}</button>`).join(' ')}</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="btn primary" data-act="yk-kaydet" data-id="${dersId}">Kaydet</button><span class="muted small">Gelmeyen ve geç kalan öğrencilerin velilerine bildirim gider.</span></div>`;
}

/* Öğretmen: bugün */
PAGES.bugun=()=>{

  const et=S.etutler.filter(e=>e.ogretmenId===O.id&&e.tarih>=TODAY&&e.ogr.length).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1).slice(0,5);
  const od=S.odevler.filter(h=>h.ogretmenId===O.id&&h.sonTarih>=addDays(TODAY,-3));
  return head(`Günaydın, ${esc(ogt(O.id).ad.split(' ')[0])}`,`${GUN[wd(TODAY)]}, ${fd(TODAY)}`)+
  `<div class="grid2"><div class="card"><h2>Bugünkü derslerim</h2>${ds.length?`<table>${ds.map(d=>{const y=S.yoklamalar.find(x=>x.dersId===d.id&&x.tarih===TODAY);return `<tr><td><b>${d.saat}</b></td><td>${sube(d.subeId).ad} · ${esc(d.ders)}</td><td class="num"><button class="btn sm ${y?'':'primary'}" data-act="yk-ac" data-id="${d.id}">${y?'Yoklama alındı':'Yoklama al'}</button></td></tr>`}).join('')}</table>`:empty('Bugün dersin yok.')}</div>
  <div class="card"><h2>Yaklaşan etüt randevuları</h2>${et.length?`<table>${et.map(e=>`<tr><td>${fds(e.tarih)} ${e.saat}</td><td>${e.ogr.map(i=>esc(ogr(i).ad)).join(', ')}</td></tr>`).join('')}</table>`:empty('Randevu yok.')}</div></div>
  <div class="card" style="margin-top:16px"><h2>Ödev durumu</h2>${od.length?`<table>${od.map(h=>{const n=S.ogrenciler.filter(o=>o.subeId===h.subeId).length;const y=Object.values(h.teslim).filter(v=>v==='yapti').length;return `<tr class="click" data-act="go" data-page="odevler:${h.id}"><td><b>${esc(h.baslik)}</b></td><td>${sube(h.subeId).ad}</td><td>${fds(h.sonTarih)}</td><td class="num">${y}/${n} yaptı</td></tr>`}).join('')}</table>`:empty('Aktif ödev yok.')}</div>`;
};

/* Denemeler */
const denemeYetki=()=>['yonetici','rehber'].includes(O.role);
PAGES.denemeler=arg=>{
  if(arg)return denemeDetay(arg);
  const list=[...S.sinavlar].filter(s=>denemeYetki()||S.dersler.some(d=>d.ogretmenId===O.id&&s.subeler.includes(d.subeId))).sort((a,b)=>a.tarih<b.tarih?1:-1);
  return head('Denemeler',`${list.length} deneme`,denemeYetki()?`<button class="btn primary" data-act="den-yeni">Yeni deneme</button>`:'')+
  `<div class="card flush"><div class="tw"><table><tr><th>Deneme</th><th>Tür</th><th>Tarih</th><th>Şubeler</th><th class="num">Katılım</th><th class="num">Ortalama</th><th>Durum</th></tr>
  ${list.map(s=>{const rr=S.sonuclar.filter(r=>r.sinavId===s.id);const avg=rr.length?rr.reduce((a,r)=>a+toplamNet(r,s),0)/rr.length:0;return `<tr class="click" data-act="go" data-page="denemeler:${s.id}"><td><b>${esc(s.ad)}</b></td><td>${esc(turAd(s))}</td><td>${fd(s.tarih)}</td><td class="muted">${s.subeler.map(x=>sube(x).ad).join(', ')}</td><td class="num">${rr.length}</td><td class="num">${rr.length?nf(avg):'—'}</td><td>${s.yayinda?'<span class="tag ok">Yayında</span>':'<span class="tag n">Taslak</span>'}</td></tr>`}).join('')||`<tr><td colspan="7">${empty('Henüz deneme yok.')}</td></tr>`}</table></div></div>`;
};
const subeSirali=(a,b)=>(sube(a.subeId).ad+a.ad).localeCompare(sube(b.subeId).ad+b.ad,'tr');
function denemeDetay(id){
  const s=S.sinavlar.find(x=>x.id===id);if(!s)return empty('Deneme bulunamadı.');const t=turOf(s);const yetki=denemeYetki();
  const ogs=S.ogrenciler.filter(o=>s.subeler.includes(o.subeId)).sort(subeSirali);const rr=S.sonuclar.filter(r=>r.sinavId===id);
  const sirali=rr.filter(r=>S.ogrenciler.some(o=>o.id===r.ogrId)).map(r=>({r,n:toplamNet(r,s)})).sort((a,b)=>b.n-a.n);
  const anahtarN=s.anahtar?Object.keys(s.anahtar).filter(k=>s.anahtar[k]).length:0;
  let h=`<a href="#" class="back" data-act="go" data-page="denemeler">← Denemeler</a>`+head(esc(s.ad),`${esc(turAd(s))} · ${fd(s.tarih)} · ${s.subeler.map(x=>sube(x).ad).join(', ')||'şube yok'} · ${rr.length} sonuç`,
    (yetki?`<button class="btn primary" data-act="imp-ac" data-id="${id}">Dosyadan yükle</button><button class="btn" data-act="anahtar" data-id="${id}">Cevap anahtarı${anahtarN?' ('+anahtarN+')':''}</button>`:'')+
    `<button class="btn" data-act="den-excel" data-id="${id}">Excel</button>`+(rr.length?`<button class="btn" data-act="karneler" data-id="${id}">Karneleri yazdır</button>`:'')+
    (yetki?`<button class="btn" data-act="den-yayin" data-id="${id}">${s.yayinda?'Yayından kaldır':'Sonuçları yayınla'}</button><button class="btn danger" data-act="den-sil" data-id="${id}">Sil</button>`:''));
  if(yetki&&!s.yayinda)h+=`<div class="banner">Bu deneme taslakta: öğrenci ve veliler sonuçları göremez. Kontrol ettikten sonra “Sonuçları yayınla” de; velilere bildirim gider.</div>`;
  const ort=t.dersler.map(([ad,q])=>{const v=rr.length?rr.reduce((a,r)=>a+dersNet(r.c[ad],t.f),0)/rr.length:0;return `<div class="stat"><div class="l">${esc(ad)}</div><div class="n">${nf(v)}</div><div class="s">ortalama / ${q} soru</div></div>`}).join('');
  h+=`<div class="stats">${ort}</div>`;
  if(rr.length&&s.subeler.length>1)h+=`<div class="card flush"><h2>Şube ortalamaları</h2><div class="tw"><table><tr><th>Şube</th><th class="num">Katılım</th>${t.dersler.map(([ad])=>`<th class="num">${esc(ad)}</th>`).join('')}<th class="num">Toplam</th></tr>${s.subeler.map(sb=>{const l=rr.filter(r=>ogr(r.ogrId).subeId===sb);if(!l.length)return '';const av=f=>nf(l.reduce((a,r)=>a+f(r),0)/l.length);return `<tr><td><b>${sube(sb).ad}</b></td><td class="num">${l.length}</td>${t.dersler.map(([ad])=>`<td class="num">${av(r=>dersNet(r.c[ad],t.f))}</td>`).join('')}<td class="num"><b>${av(r=>toplamNet(r,s))}</b></td></tr>`}).join('')}</table></div></div>`;
  if(yetki){
    h+=`<details class="card" ${rr.length?'':'open'}><summary>Elle sonuç girişi (${ogs.length} öğrenci)</summary><p class="small muted" style="margin:8px 0">D: doğru, Y: yanlış · ${t.f?`net = D − Y/${t.f}`:'yanlış doğruyu götürmez'} · Kalabalık listeler için “Dosyadan yükle” daha hızlı.</p>
    <form data-form="sonuc" data-id="${id}"><div class="tw"><table><tr><th>Öğrenci</th>${t.dersler.map(([ad,q])=>`<th>${esc(ad)} <span class="muted">(${q})</span></th>`).join('')}<th class="num">Net</th></tr>
    ${ogs.map(o=>{const r=rr.find(x=>x.ogrId===o.id);return `<tr data-netrow="${s.id}"><td><b>${esc(o.ad)}</b><br><span class="small muted">${sube(o.subeId).ad}${o.no?' · '+esc(o.no):''}</span></td>${t.dersler.map(([ad,q])=>{const c=r&&r.c[ad]||{};return `<td><div class="row" style="flex-wrap:nowrap;gap:4px"><input name="${o.id}|${ad}|d" value="${c.d==null?'':c.d}" inputmode="decimal" placeholder="D" style="width:52px;padding:5px"><input name="${o.id}|${ad}|y" value="${c.y==null?'':c.y}" inputmode="numeric" placeholder="Y" style="width:52px;padding:5px"></div></td>`}).join('')}<td class="num"><b data-net>${r?nf(toplamNet(r,s)):'—'}</b></td></tr>`}).join('')||`<tr><td colspan="9">${empty('Bu denemeye şube eklenmemiş.')}</td></tr>`}</table></div><button class="btn primary" type="submit" style="margin-top:10px">Sonuçları kaydet</button></form></details>`;
  }
  h+=`<div class="card flush" style="margin-top:16px"><h2>Sıralama</h2><div class="tw"><table><tr><th class="num">Sıra</th><th>No</th><th>Öğrenci</th><th>Şube</th>${t.dersler.map(([ad])=>`<th class="num">${esc(ad)}</th>`).join('')}<th class="num">Toplam</th></tr>
  ${sirali.map(x=>{const o=ogr(x.r.ogrId);return `<tr><td class="num">${x.r.sira||''}</td><td class="muted">${esc(o.no||'')}</td><td>${esc(o.ad)}</td><td>${sube(o.subeId).ad}</td>${t.dersler.map(([ad])=>`<td class="num">${nf(dersNet(x.r.c[ad],t.f))}</td>`).join('')}<td class="num"><b>${nf(x.n)}</b></td></tr>`}).join('')||`<tr><td colspan="12">${empty('Henüz sonuç yok. “Dosyadan yükle” ile Excel ya da CSV dosyası yükleyebilirsin.')}</td></tr>`}</table></div></div>`;
  return h;
}

/* Karne */
PAGES.karne=()=>{
  const id=aktifOgr();const o=ogr(id);const ss=ogrSinavlar(id);
  let h=(O.role==='veli'?cocukSec():'')+head(O.role==='veli'?`${esc(o.ad.split(' ')[0])} · Karne`:'Karnem',`${sube(o.subeId).ad} · Hedef: ${esc(o.hedef)}`);
  if(!ss.length)return h+`<div class="card">${empty('Henüz yayınlanmış deneme sonucu yok.')}</div>`;
  const secId=ss.some(s=>s.id===O.f_sinav)?O.f_sinav:ss[ss.length-1].id;const i=ss.findIndex(s=>s.id===secId);const s=ss[i];const r=sonucOf(s.id,id);const n=toplamNet(r,s);
  const ssT=ayniTur(ss,s).filter(x=>x.tarih<=s.tarih);const pv=ssT[ssT.length-2];const onc=pv?n-toplamNet(sonucOf(pv.id,id),pv):null;
  const tumN=S.sonuclar.filter(x=>x.sinavId===s.id).map(x=>toplamNet(x,s)).sort((a,b)=>b-a);const sira=r.sira||(tumN.findIndex(v=>v<=n+1e-9)+1);const tum={length:r.katilim||tumN.length};
  const zd=zayifDersler(r,s);
  h+=`<div class="card"><div class="row"><select class="inline-sel" data-chg="fsinav">${ss.map(x=>opt(x.id,x.ad+' · '+fds(x.tarih),secId)).join('')}</select><button class="btn" data-act="karne-yazdir" data-id="${s.id}" data-ogr="${id}">Yazdır / PDF</button></div></div>
  <div class="grid3"><div class="card"><div class="muted small">Toplam net</div><div class="big">${nf(n)}</div>${onc!==null?`<p class="small" style="margin-top:6px"><span class="tag ${onc>=0?'acc':'warn'}">${onc>=0?'+':''}${nf(onc)} net</span> önceki denemeye göre</p>`:''}</div>
  <div class="card"><div class="muted small">Kurum sırası</div><div class="big">${sira} <span class="muted" style="font-size:18px">/ ${tum.length}</span></div><p class="small muted" style="margin-top:6px">Kıyas ikinci planda; önemli olan kendi gelişimin.</p></div>
  <div class="card"><div class="muted small">Bu hafta önceliğin</div><p style="font-size:18px;font-weight:600;margin:4px 0 8px">${zd.join(' ve ')}</p>${O.role==='ogrenci'?`<button class="btn sm primary" data-act="go" data-page="etutal">Etüt al</button>`:'<p class="small muted">Etüt için öğrenci uygulamadan randevu alabilir.</p>'}</div></div>
  <div class="grid2" style="margin-top:16px"><div class="card"><h2>Ders bazında</h2>${dersBars(r,s)}</div><div class="card"><h2>Gelişim · ${esc(turAd(s))}</h2>${trendSvg(ssT.map(x=>toplamNet(sonucOf(x.id,id),x)),ssT.map(x=>x.ad.replace(/^\D+/,'D')))}</div></div>`;
  return h;
};

/* Ödevler (öğretmen) */

  if(arg){const hw=S.odevler.find(x=>x.id===arg);if(!hw)return empty('Ödev bulunamadı.');const ogs=S.ogrenciler.filter(o=>o.subeId===hw.subeId);
    return `<a href="#" class="back" data-act="go" data-page="odevler">← Ödevler</a>`+head(esc(hw.baslik),`${sube(hw.subeId).ad} · son tarih ${fd(hw.sonTarih)}`,`<button class="btn danger" data-act="odev-sil" data-id="${hw.id}">Sil</button>`)+
    `<div class="card"><p>${esc(hw.aciklama)}</p></div><div class="card flush"><table>${ogs.map(o=>{const st=hw.teslim[o.id]||'bekliyor';return `<tr><td><b>${esc(o.ad)}</b></td><td class="num"><div class="seg">${[['yapti','Yaptı'],['eksik','Eksik'],['bekliyor','Bekliyor']].map(([k,l])=>`<button class="${st===k?'on':''}" data-act="odev-st" data-id="${hw.id}" data-ogr="${o.id}" data-v="${k}">${l}</button>`).join('')}</div></td></tr>`}).join('')}</table></div>`}

};
PAGES.odevlerim=()=>{
  const o=ogr(O.id);const list=S.odevler.filter(h=>h.subeId===o.subeId).sort((a,b)=>a.sonTarih<b.sonTarih?-1:1);
  return head('Ödevlerim',`${list.filter(h=>h.teslim[O.id]!=='yapti').length} bekleyen ödev`)+`<div class="card flush"><table><tr><th>Ödev</th><th>Öğretmen</th><th>Son tarih</th><th>Durum</th><th></th></tr>${list.map(h=>{const st=h.teslim[O.id];return `<tr><td><b>${esc(h.baslik)}</b><br><span class="small muted">${esc(h.aciklama)}</span></td><td class="muted">${esc(ogt(h.ogretmenId).ad)}</td><td>${fd(h.sonTarih)}${h.sonTarih<TODAY&&st!=='yapti'?' <span class="tag bad">Geçti</span>':''}</td><td>${st==='yapti'?'<span class="tag ok">Yaptım</span>':st==='eksik'?'<span class="tag warn">Eksik</span>':'<span class="tag n">Bekliyor</span>'}</td><td class="num">${st==='yapti'?`<button class="btn sm" data-act="odev-ben" data-id="${h.id}" data-v="">Geri al</button>`:`<button class="btn sm primary" data-act="odev-ben" data-id="${h.id}" data-v="yapti">Yaptım</button>`}</td></tr>`}).join('')||`<tr><td colspan="5">${empty('Ödev yok.')}</td></tr>`}</table></div>`;
};

/* Etüt */
PAGES.etut=()=>{
  if(O.role==='yonetici'){
    const up=S.etutler.filter(e=>e.tarih>=TODAY);
    return head('Etüt','Öğretmenlerin açtığı etüt saatleri ve doluluk')+`<div class="card flush"><table><tr><th>Öğretmen</th><th class="num">Açık saat</th><th class="num">Dolu</th><th class="num">Doluluk</th></tr>${S.ogretmenler.filter(t=>!t.rehber).map(t=>{const m=up.filter(e=>e.ogretmenId===t.id);const d=m.filter(e=>e.ogr.length>=e.kontenjan).length;return `<tr><td><b>${esc(t.ad)}</b> <span class="muted">${esc(t.brans)}</span></td><td class="num">${m.length}</td><td class="num">${d}</td><td class="num">${m.length?'%'+Math.round(d/m.length*100):'—'}</td></tr>`}).join('')}</table></div>`;
  }
  const mine=S.etutler.filter(e=>e.ogretmenId===O.id&&e.tarih>=TODAY).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);const gunler=[...new Set(mine.map(e=>e.tarih))];
  return head('Etüt saatlerim','Öğrenciler bu saatlerden randevu alır.',`<button class="btn primary" data-act="etut-yeni">Saat ekle</button>`)+
  (gunler.map(g=>`<div class="card"><h3>${GUN[wd(g)]}, ${fd(g)}</h3><table>${mine.filter(e=>e.tarih===g).map(e=>`<tr><td style="width:80px"><b>${e.saat}</b></td><td>${e.ogr.length?e.ogr.map(i=>esc(ogr(i).ad)).join(', '):'<span class="muted">Boş</span>'}</td><td class="muted small">${e.ogr.length}/${e.kontenjan}</td><td class="num">${e.ogr.length?'':`<button class="link" data-act="etut-sil" data-id="${e.id}">Kaldır</button>`}</td></tr>`).join('')}</table></div>`).join('')||`<div class="card">${empty('Açık etüt saatin yok.')}</div>`);
};
PAGES.etutal=()=>{
  const ft=O.f_ogt||'';const ws=weekStart(TODAY),we=addDays(ws,6);const hak=S.ayarlar.etutHak;
  const benim=S.etutler.filter(e=>e.ogr.includes(O.id)&&e.tarih>=TODAY).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);
  const buHafta=S.etutler.filter(e=>e.ogr.includes(O.id)&&e.tarih>=ws&&e.tarih<=we).length;
  const ac=S.etutler.filter(e=>e.tarih>=TODAY&&(!ft||e.ogretmenId===ft)).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);const gunler=[...new Set(ac.map(e=>e.tarih))];
  return head('Etüt al',`Bu hafta ${Math.max(0,hak-buHafta)} etüt hakkın kaldı (haftalık ${hak})`,`<select class="inline-sel" data-chg="fogt">${opt('','Tüm öğretmenler',ft)}${S.ogretmenler.filter(t=>!t.rehber).map(t=>opt(t.id,t.ad+' · '+t.brans,ft)).join('')}</select>`)+
  (benim.length?`<div class="card"><h2>Randevularım</h2><table>${benim.map(e=>`<tr><td>${GUN[wd(e.tarih)]} ${fds(e.tarih)}, <b>${e.saat}</b></td><td>${esc(ogt(e.ogretmenId).ad)} · ${esc(ogt(e.ogretmenId).brans)}</td><td class="num"><button class="btn sm" data-act="etut-iptal" data-id="${e.id}">İptal et</button></td></tr>`).join('')}</table></div>`:'')+
  gunler.map(g=>`<div class="card"><h3>${GUN[wd(g)]}, ${fd(g)}</h3><div class="slots">${ac.filter(e=>e.tarih===g).map(e=>{const mine=e.ogr.includes(O.id),full=e.ogr.length>=e.kontenjan;return `<button class="slotbtn ${mine?'mine':full?'full':''}" ${full||mine?'':`data-act="etut-al" data-id="${e.id}"`}><b>${e.saat}</b><small>${esc(ogt(e.ogretmenId).ad)}</small><small>${mine?'Senin randevun':full?'Dolu':esc(ogt(e.ogretmenId).brans)}</small></button>`}).join('')}</div></div>`).join('');

/* Check-in */

  <form data-form="checkin">${sc('genel','Bu hafta genel olarak nasılsın?','1 çok zor · 5 çok iyi',v.genel)}${sc('uyku','Uykun nasıldı?','1 çok yetersiz · 5 yeterli',v.uyku)}${sc('stres','Sınav stresin ne düzeyde?','1 düşük · 5 çok yüksek',v.stres)}

PAGES.checkin=()=>{
  const son=S.ogrenciler.map(o=>({o,c:S.checkinler.filter(c=>c.ogrId===o.id).sort((a,b)=>a.tarih<b.tarih?1:-1)[0]}));

  son.sort((a,b)=>{const s=x=>x.c?(x.c.gorusme?-10:0)+x.c.genel-x.c.stres:99;return s(a)-s(b)});
  return head('Check-in sonuçları',`Son 7 günde ${yanit}/${S.ogrenciler.length} öğrenci yanıtladı`)+`<div class="card flush"><div class="tw"><table><tr><th>Öğrenci</th><th>Tarih</th><th class="num">Genel</th><th class="num">Uyku</th><th class="num">Stres</th><th>Not</th><th></th></tr>${son.map(({o,c})=>`<tr class="click" data-act="go" data-page="ogrenciler:${o.id}"><td><b>${esc(o.ad)}</b><br><span class="small muted">${sube(o.subeId).ad}</span></td>${c?`<td>${fds(c.tarih)}</td><td class="num">${c.genel<=2?`<span class="tag warn">${c.genel}</span>`:c.genel}</td><td class="num">${c.uyku}</td><td class="num">${c.stres>=5?`<span class="tag warn">${c.stres}</span>`:c.stres}</td><td class="small">${esc(c.not)}</td><td>${c.gorusme?'<span class="tag acc">Görüşme istiyor</span>':''}</td>`:`<td colspan="6" class="muted">Yanıt yok</td>`}</tr>`).join('')}</table></div></div>`;
};

/* Rehber paneli */

  <div class="grid2"><div class="card"><h2>Yaklaşan takipler</h2>${tk.length?`<table>${tk.map(g=>`<tr><td>${fds(g.takip)}</td><td>${esc(ogr(g.ogrId).ad)}</td><td class="muted small">${esc(g.konu)}</td></tr>`).join('')}</table>`:empty('Yaklaşan takip yok.')}</div>

  <div class="card"><div class="muted small">Bu haftanın önceliği</div>${l?`<p style="font-size:18px;font-weight:600;margin:4px 0">${zayifDersler(sonucOf(l.id,O.id),l).join(' ve ')}</p><p class="small muted">Son denemede en çok puan kaybettiğin dersler</p>`:empty('—')}</div></div>
  <div class="grid2" style="margin-top:16px"><div class="card"><h2>Bugün</h2>${ds.length||et.some(e=>e.tarih===TODAY)?`<table>${ds.map(d=>`<tr><td><b>${d.saat}</b></td><td>${esc(d.ders)}</td><td class="muted">${esc(ogt(d.ogretmenId).ad)}</td></tr>`).join('')}${et.filter(e=>e.tarih===TODAY).map(e=>`<tr><td><b>${e.saat}</b></td><td>Etüt · ${esc(ogt(e.ogretmenId).brans)} <span class="tag acc">Etüt</span></td><td class="muted">${esc(ogt(e.ogretmenId).ad)}</td></tr>`).join('')}</table>`:empty('Bugün dersin yok.')}

  <div class="card"><h2>Rehber öğretmenden</h2>${gn?`<p>${esc(gn.veliNotu)}</p><p class="small muted">${esc(ogt(gn.rehberId).ad)} · ${fds(gn.tarih)}</p>`:empty('Paylaşılan bir not yok.')}<button class="btn sm" data-act="rehber-iste">Görüşme talep et</button></div></div>

  `<div class="stats">${stat('Tahsilat oranı','%'+(vad.length?Math.round((vad.length-ger.length)/vad.length*100):100),'vadesi gelenler içinde')}${stat('Geciken',tl(ger.reduce((a,t)=>a+t.tutar,0)),ger.length+' taksit')}${stat('Bu ay tahsil edilen',tl(ayTah))}</div>

/* Mesajlar */
function kisiler(){
  const r=O.role,L=[];const k=t=>(t.rehber?'rehber:':'ogretmen:')+t.id;
  const subOgt=subs=>S.ogretmenler.filter(t=>t.rehber||S.dersler.some(d=>d.ogretmenId===t.id&&subs.includes(d.subeId)));
  if(r==='veli'){subOgt(veli(O.id).cocuklar.map(c=>ogr(c).subeId)).forEach(t=>L.push(k(t)));L.push('yonetici:y1')}
  if(r==='ogrenci'){subOgt([ogr(O.id).subeId]).forEach(t=>L.push(k(t)))}
  if(r==='ogretmen'){const subs=[...new Set(S.dersler.filter(d=>d.ogretmenId===O.id).map(d=>d.subeId))];S.ogrenciler.filter(o=>subs.includes(o.subeId)).forEach(o=>{L.push('veli:'+o.veliId);L.push('ogrenci:'+o.id)});S.ogretmenler.filter(t=>t.id!==O.id).forEach(t=>L.push(k(t)));L.push('yonetici:y1')}
  if(r==='rehber'){S.ogrenciler.forEach(o=>{L.push('ogrenci:'+o.id);L.push('veli:'+o.veliId)});S.ogretmenler.filter(t=>t.id!==O.id).forEach(t=>L.push(k(t)));L.push('yonetici:y1')}
  if(r==='yonetici'){S.ogretmenler.forEach(t=>L.push(k(t)));S.veliler.forEach(v=>L.push('veli:'+v.id))}
  return [...new Set(L)];
}

  const sorted=[...ks].sort((a,b)=>{const x=son(a),y=son(b);if(x&&y)return x.zaman<y.zaman?1:-1;if(x)return -1;if(y)return 1;return keyAd(a).localeCompare(keyAd(b),'tr')});

async function xlsxYukle(){if(window.XLSX)return;await scriptYukle(XLSX_URL);if(!window.XLSX)throw new Error('Excel kütüphanesi yüklenemedi')}
function parseCSV(t){t=t.replace(/^﻿/,'');const ilk=t.split(/\r?\n/)[0]||'';const dl=[';','\t',','].map(d=>[d,ilk.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()))}
async function dosyaOku(file){
  const buf=await file.arrayBuffer();const ad=lower(file.name);
  if(/\.(csv|txt|tsv)$/.test(ad)){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1254').decode(buf)}return parseCSV(t)}
  await xlsxYukle();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false}).filter(r=>r.some(c=>String(c).trim()));
}

const ALIAS={'Türkçe':['turkce','tur','trk','turkce testi'],'Sosyal':['sosyal','sos','sosyal bilimler','sosyal bilimler testi'],'Matematik':['matematik','mat','temel matematik','matematik testi'],'Fen':['fen','fen bilimleri','fen bilimleri testi'],'Fen Bilimleri':['fen bilimleri','fen'],
  'Fizik':['fizik','fiz'],'Kimya':['kimya','kim'],'Biyoloji':['biyoloji','biy','bio'],'Edebiyat':['edebiyat','edb','tde','turk dili ve edebiyati','turk dili edebiyati','edebiyat 1'],
  'Tarih-1':['tarih 1','tarih1','tar 1','tar1','tarih'],'Coğrafya-1':['cografya 1','cografya1','cog 1','cog1','cografya'],'Tarih-2':['tarih 2','tarih2','tar 2','tar2'],'Coğrafya-2':['cografya 2','cografya2','cog 2','cog2'],
  'Felsefe':['felsefe','fel','felsefe grubu','fgb'],'Din':['din','dkab','din kulturu','din kulturu ve ahlak bilgisi','din kult'],'İnkılap':['inkilap','ink','inkilap tarihi','tc inkilap tarihi','t c inkilap tarihi ve ataturkculuk','tarih'],
  'İngilizce':['ingilizce','ing','yabanci dil'],'Yabancı Dil':['yabanci dil','ydt','ingilizce','ing','dil']};
const aliasOf=ad=>ALIAS[ad]||[norm(ad)];
const ALT={d:'d',dogru:'d',y:'y',yanlis:'y',n:'n',net:'n',b:'b',bos:'b'};
const GURULTU=new Set(['sayisi','sayi','adedi','adet','soru','testi','test','puani']);
function basliklar(rows,ekKelime){
  const kel=new Set(['ad','adi','soyad','soyadi','isim','ogrenci','no','numara','sube','sinif','d','y','n','b','dogru','yanlis','net','bos','kitapcik','cevap','cevaplar','veli','telefon','tel','hedef','gsm',...ekKelime]);
  let best=0,bs=-1;
  for(let i=0;i<Math.min(15,rows.length);i++){const sc=rows[i].filter(c=>{const n=norm(c);return n&&n.split(' ').some(w=>kel.has(w))}).length;if(sc>bs){bs=sc;best=i}}
  const altMi=r=>{const d=(r||[]).filter(c=>norm(c));return d.length>=2&&d.filter(c=>ALT[norm(c)]).length>=d.length*0.6};
  if(best>0&&altMi(rows[best])&&(rows[best-1]||[]).some(c=>norm(c)))best--;
  const h=rows[best]||[],nx=rows[best+1]||[];
  const nxDolu=nx.filter(c=>norm(c));const iki=nxDolu.length>=2&&nxDolu.filter(c=>ALT[norm(c)]).length>=nxDolu.length*0.6;
  const w=Math.max(...rows.slice(best,best+8).map(r=>r.length),0);const labels=[];let carry='';
  for(let c=0;c<w;c++){let a=String(h[c]==null?'':h[c]).trim();
    if(iki){if(a)carry=a;else a=carry;const b=String(nx[c]==null?'':nx[c]).trim();labels.push((a+(b?' '+b:'')).trim())}else labels.push(a)}
  return {labels,start:best+(iki?2:1)};
}
function kolonCoz(label){let w=norm(label).split(' ').filter(x=>x&&!GURULTU.has(x));if(!w.length)return null;let tip=null;
  if(ALT[w[w.length-1]]&&w.length>1){tip=ALT[w.pop()]}else if(ALT[w[0]]&&w.length>1){tip=ALT[w.shift()]}
  else{const m=w[w.length-1].match(/^(.+?)(dogru|yanlis|net)$/);if(m){tip=ALT[m[2]];w[w.length-1]=m[1]}}
  return {tip,ders:w.join(' ')}}
function dersBul(r,dersler){if(!r)return null;for(const [ad] of dersler)if(aliasOf(ad).includes(r))return ad;
  for(const [ad] of dersler)if(aliasOf(ad).some(a=>a.length>=3&&(r.startsWith(a+' ')||a.startsWith(r+' '))))return ad;return null}
const RX={no:/^(no|numara|ogr no|ogrenci no|ogrenci numarasi|okul no|okul numarasi|numarasi|ogrenci no su)$/,ad:/^(ad|adi|isim|ad soyad|adi soyadi|ad soyadi|adi soyad|ogrenci|ogrenci adi|ogrenci adi soyadi|ogrenci ad soyad|ad ve soyad|isim soyisim|ogrencinin adi soyadi)$/,
  soyad:/^(soyad|soyadi|soyisim)$/,kit:/^(kitapcik|kitapcik turu|kitapcik tipi|grup|kt)$/,cevap:/cevap/,sube:/^(sube|sinif|sinif sube|sube adi|sinifi|subesi)$/,veli:/^(veli|veli adi|veli adi soyadi|veli ad soyad|velinin adi soyadi|anne baba)$/,tel:/(tel|telefon|gsm|cep)/,hedef:/hedef/};

let IMP=null;
function impOto(){const s=S.sinavlar.find(x=>x.id===IMP.sid);const t=turOf(s);const m={no:-1,ad:-1,soyad:-1,kit:-1,cevap:-1,ders:{}};t.dersler.forEach(([ad])=>m.ders[ad]={d:-1,y:-1,n:-1});
  IMP.labels.forEach((L,c)=>{const n=norm(L);if(!n)return;
    if(m.no<0&&RX.no.test(n)){m.no=c;return}if(m.kit<0&&RX.kit.test(n)){m.kit=c;return}if(m.cevap<0&&RX.cevap.test(n)){m.cevap=c;return}
    if(m.soyad<0&&RX.soyad.test(n)){m.soyad=c;return}if(m.ad<0&&RX.ad.test(n)){m.ad=c;return}
    const k=kolonCoz(L);if(!k||!k.tip||k.tip==='b')return;const ad=dersBul(k.ders,t.dersler);if(ad&&m.ders[ad][k.tip]<0)m.ders[ad][k.tip]=c});
  if(m.cevap<0){const data=IMP.rows.slice(IMP.start,IMP.start+30);IMP.labels.forEach((L,c)=>{if(m.cevap>=0)return;const v=data.map(r=>String(r[c]==null?'':r[c]));if(v.filter(x=>x.length>=10&&/^[A-Ea-e\s*\-.]+$/.test(x)).length>=Math.max(1,v.length*0.5))m.cevap=c})}
  IMP.map=m;const dyVar=Object.values(m.ders).some(x=>x.d>=0||x.n>=0);IMP.mod=(!dyVar&&m.cevap>=0)?'cevap':'dy';
}
function ogrEsle(no,ad){if(no){const o=S.ogrenciler.find(x=>x.no&&String(x.no).trim()===no);if(o)return o}
  if(ad){const k=adAnahtar(ad);const l=S.ogrenciler.filter(x=>adAnahtar(x.ad)===k);if(l.length===1)return l[0]}return null}
function impHesap(){
  const s=S.sinavlar.find(x=>x.id===IMP.sid);const t=turOf(s);const m=IMP.map;const sonuc=new Map();const eslesmeyen=[];let asim=0,anahtarYok=0;
  const hucre=(r,c)=>c>=0?String(r[c]==null?'':r[c]).trim():'';
  IMP.rows.slice(IMP.start).forEach(r=>{
    const no=hucre(r,m.no).replace(/\.0$/,'');let ad=hucre(r,m.ad);if(m.soyad>=0)ad=(ad+' '+hucre(r,m.soyad)).trim();if(!no&&!ad)return;
    if(/^(toplam|ortalama|genel|kurum|sube|sınıf)\b/i.test(ad)&&!no)return;
    const c={};let dolu=false;
    if(IMP.mod==='cevap'){const kit=(hucre(r,m.kit).toUpperCase().match(/[A-D]/)||['A'])[0];const an=s.anahtar||{};const key=an[kit]||an.A;if(!key){anahtarYok++;return}
      const cv=(m.cevap>=0?String(r[m.cevap]==null?'':r[m.cevap]):'').replace(/[\r\n]+$/,'').toUpperCase();if(!cv.trim())return;dolu=true;let p=0;
      t.dersler.forEach(([d,q])=>{let D=0,Y=0;for(let i=0;i<q;i++,p++){const k=key[p]||' ',a=cv[p]||' ';if(k==='X'||k==='*'){D++;continue}if(!/[A-E]/.test(a))continue;if(a===k)D++;else Y++}c[d]={d:D,y:Y}})}
    else{t.dersler.forEach(([d,q])=>{const mm=m.ders[d];const D=mm.d>=0?num(r[mm.d]):null,Y=mm.y>=0?num(r[mm.y]):null,N=mm.n>=0?num(r[mm.n]):null;let v=null;
      if(D!=null&&Y!=null)v={d:D,y:Y};else if(D!=null&&N!=null)v={d:D,y:t.f?Math.max(0,Math.round((D-N)*t.f*100)/100):0};else if(N!=null)v={d:N,y:0};else if(D!=null)v={d:D,y:0};
      if(v){dolu=true;if(v.d+v.y>q+0.001)asim++;c[d]=v}else c[d]={d:0,y:0}})}
    if(!dolu)return;
    const o=ogrEsle(no,ad);if(o)sonuc.set(o.id,{o,c,etiket:ad||no});else eslesmeyen.push((no?no+' · ':'')+(ad||''))});
  return {out:[...sonuc.values()],eslesmeyen,asim,anahtarYok};
}

  'oakt-sablon':async()=>{await excelIndir('ogrenci-sablonu',[['No','Ad Soyad','Şube','Veli Ad Soyad','Veli Telefon','Hedef'],['1001','Örnek Öğrenci',S.subeler[0]?S.subeler[0].ad:'12-A','Örnek Veli','05xx xxx xx xx','Tıp']])},
  'oakt-onay':()=>{const {yeni}=oaktHesap();let n=0;
    yeni.forEach(x=>{let sb=subeBul(x.sb);if(!sb){sb={id:'s'+uid(),ad:x.sb,kademe:/^[5-8]/.test(x.sb.trim())?'LGS':'YKS',alan:''};S.subeler.push(sb)}
      const id='o'+uid();let v=x.veli?S.veliler.find(v=>adAnahtar(v.ad)===adAnahtar(x.veli)&&(!x.tel||!v.tel||norm(v.tel)===norm(x.tel))):null;
      if(v){v.cocuklar.push(id);if(x.tel&&!v.tel)v.tel=x.tel}else{v={id:'v'+uid(),ad:x.veli||x.ad+' · Velisi',tel:x.tel,cocuklar:[id]};S.veliler.push(v)}
      S.ogrenciler.push({id,no:x.no,ad:x.ad,subeId:sb.id,veliId:v.id,hedef:x.hedef,kayit:TODAY});n++});
    save();closeModal();OAKT=null;toast(`${n} öğrenci eklendi`);render()},
  'ogr-excel':async()=>{await excelIndir('ogrenci-listesi',[['No','Ad Soyad','Şube','Hedef','Veli','Veli Telefon','Kayıt'],...[...S.ogrenciler].sort(subeSirali).map(o=>{const v=veli(o.veliId);return [o.no||'',o.ad,sube(o.subeId).ad,o.hedef||'',v.ad,v.tel||'',o.kayit||'']})])},
  'tah-excel':async()=>{await excelIndir('tahsilat',[['Öğrenci','Şube','Vade','Tutar','Durum','Ödeme tarihi'],...[...S.taksitler].sort((a,b)=>a.vade<b.vade?-1:1).map(t=>[ogr(t.ogrId).ad,sube(ogr(t.ogrId).subeId).ad,t.vade,t.tutar,t.odendi?'Ödendi':t.vade<TODAY?'Gecikti':'Bekliyor',t.odendi||''])])},
  'yr-excel':async()=>{const bas=O.f_bas||TODAY.slice(0,8)+'01',bit=O.f_bit||TODAY;const fs=O.f_sube||'';await excelIndir(`devamsizlik ${bas} ${bit}`,[['No','Öğrenci','Şube','Ders','Gelmedi','Geç'],...S.ogrenciler.filter(o=>!fs||o.subeId===fs).sort(subeSirali).map(o=>{let top=0,yok=0,gec=0;S.yoklamalar.forEach(y=>{if(y.tarih>=bas&&y.tarih<=bit&&y.kayit[o.id]){top++;if(y.kayit[o.id]==='yok')yok++;if(y.kayit[o.id]==='gec')gec++}});return [o.no||'',o.ad,sube(o.subeId).ad,top,yok,gec]})])},
  export:()=>modal('Veriyi dışa aktar',`<p class="small muted">Dosyayı indir ya da metni kopyalayıp arkadaşına gönder. O da “İçe aktar” ile yükler.</p><div class="row" style="margin-bottom:10px"><button class="btn primary" data-act="exp-indir">Dosya indir</button><button class="btn" data-act="exp-kopya">Metni kopyala</button></div><textarea id="exp-t" readonly style="min-height:160px;font-size:12px">${esc(JSON.stringify(S))}</textarea>`),
  'exp-indir':()=>{try{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`dershane-veri-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){toast('İndirme bu ortamda kapalı; metni kopyala')}},
  'exp-kopya':()=>{const t=$('#exp-t');try{navigator.clipboard.writeText(t.value).then(()=>toast('Kopyalandı'),()=>{t.select();toast('Metni seçtim; Ctrl+C ile kopyala')})}catch(e){t.select();toast('Metni seçtim; Ctrl+C ile kopyala')}},
  import:()=>modal('Veriyi içe aktar',`<p class="small muted">Dışa aktarılmış dosyayı seç ya da metni yapıştır. Mevcut veri değişir.</p><div class="row" style="margin-bottom:10px"><button class="btn" data-act="imp-dosya">Dosya seç</button></div><form data-form="iceaktar"><textarea name="json" placeholder="Metni buraya yapıştır" style="min-height:140px;font-size:12px"></textarea><button class="btn primary" type="submit" style="margin-top:10px">İçe aktar</button></form>`),
  'imp-dosya':()=>$('#file-in').click(),
  reset:()=>ask('Tüm değişiklikler silinip demo veriye dönülsün mü?',()=>{S=seed();save();toast('Demo veri yüklendi');render()})
};
const FORM={
  sonuc:(f,el)=>{const id=el.dataset.id;const s=S.sinavlar.find(x=>x.id===id);const t=turOf(s);const by={};let hata='';
    Object.entries(f).forEach(([k,v])=>{const [oid,ders,kk]=k.split('|');if(v===''||v==null)return;const n=num(v);if(n==null||n<0){hata='Sayılar 0 veya daha büyük olmalı.';return}by[oid]=by[oid]||{};by[oid][ders]=by[oid][ders]||{d:0,y:0};by[oid][ders][kk]=n});
    Object.entries(by).forEach(([oid,c])=>t.dersler.forEach(([ad,q])=>{if(c[ad]&&c[ad].d+c[ad].y>q)hata=`${ogr(oid).ad} · ${ad}: doğru + yanlış ${q} soruyu geçemez.`}));
    if(hata){toast(hata);return}
    Object.entries(by).forEach(([oid,c])=>{let r=sonucOf(id,oid);t.dersler.forEach(([ad])=>{c[ad]=c[ad]||{d:0,y:0}});if(r)r.c=c;else S.sonuclar.push({id:id+'_'+oid,sinavId:id,ogrId:oid,c})});
    siraHesapla(s,S.sonuclar);
    save();toast('Sonuçlar kaydedildi');render()},
  ders:f=>{const gun=+f.gun;if(S.dersler.some(d=>d.gun===gun&&d.saat===f.saat&&d.ogretmenId===f.ogretmenId)){toast(`${ogt(f.ogretmenId).ad} bu saatte başka bir derste`);return}
    if(S.dersler.some(d=>d.gun===gun&&d.saat===f.saat&&d.subeId===f.subeId)){toast('Bu şubenin bu saatte zaten dersi var');return}
    S.dersler.push({id:uid(),subeId:f.subeId,ogretmenId:f.ogretmenId,gun,saat:f.saat,ders:f.ders.trim()});O.f_sube=f.subeId;saveO();save();closeModal();toast('Ders eklendi');render()},
  ogrenci:f=>{const no=(f.no||'').trim();if(no&&S.ogrenciler.some(x=>String(x.no)===no)){toast('Bu numara başka öğrencide var');return}const id='o'+uid();let vid;
    if(f.veliMevcut){vid=f.veliMevcut;veli(vid).cocuklar.push(id)}else{if(!(f.veli||'').trim()){toast('Veli adını yaz ya da mevcut veliyi seç');return}vid='v'+uid();S.veliler.push({id:vid,ad:f.veli.trim(),tel:(f.tel||'').trim(),cocuklar:[id]})}
    S.ogrenciler.push({id,no,ad:f.ad.trim(),subeId:f.subeId,veliId:vid,hedef:f.hedef.trim(),kayit:TODAY});
    const adet=+f.adet||0;for(let i=0;i<adet;i++){const d=D(TODAY);d.setMonth(d.getMonth()+i+1);d.setDate(15);S.taksitler.push({id:uid(),ogrId:id,vade:iso(d),tutar:+f.tutar||0,odendi:null})}
    save();closeModal();toast('Öğrenci eklendi');render()},
  deneme:f=>{const subs=S.subeler.filter(s=>f['sube_'+s.id]).map(s=>s.id);if(!subs.length){toast('En az bir şube seç');return}
    const sn={id:'n'+uid(),ad:f.ad.trim(),tur:f.tur,tarih:f.tarih,subeler:subs,yayinda:false};
    if(f.tur==='OZEL'){const dl=(f.ozelDers||'').split(',').map(x=>x.split(':').map(y=>y.trim())).filter(x=>x[0]&&+x[1]>0).map(x=>[x[0],+x[1]]);if(!dl.length){toast('Özel deneme için dersleri yaz: Matematik:20, Geometri:10');return}sn.ozel={f:+f.ozelF,dersler:dl}}
    S.sinavlar.push(sn);save();closeModal();go('denemeler:'+sn.id)},
  odev:f=>{S.odevler.push({id:uid(),ogretmenId:O.id,subeId:f.subeId,baslik:f.baslik.trim(),aciklama:f.aciklama.trim(),sonTarih:f.sonTarih,teslim:{}});save();closeModal();toast('Ödev verildi');render()},
  etut:f=>{const adet=Math.max(1,+f.adet||1);let [h,m]=f.saat.split(':').map(Number);let n=0;
    for(let i=0;i<adet;i++){const s=`${pad(h)}:${pad(m)}`;if(!S.etutler.some(e=>e.ogretmenId===O.id&&e.tarih===f.tarih&&e.saat===s)){S.etutler.push({id:uid(),ogretmenId:O.id,tarih:f.tarih,saat:s,kontenjan:Math.max(1,+f.kontenjan||1),ogr:[]});n++}m+=30;if(m>=60){m-=60;h++}}
    save();closeModal();toast(`${n} etüt saati eklendi`);render()},
  checkin:f=>{const son=S.checkinler.filter(c=>c.ogrId===O.id).sort((a,b)=>a.tarih<b.tarih?1:-1)[0];const v={genel:+f.genel,uyku:+f.uyku,stres:+f.stres,not:(f.not||'').trim(),gorusme:!!f.gorusme};
    if(son&&daysBetween(son.tarih,TODAY)<7)Object.assign(son,v,{tarih:TODAY});else S.checkinler.push({id:uid(),ogrId:O.id,tarih:TODAY,...v});save();toast('Teşekkürler, check-in kaydedildi');go('oana')},
  gorusme:f=>{S.gorusmeler.push({id:uid(),ogrId:f.ogrId,rehberId:O.id,tarih:f.tarih,tur:f.tur,konu:f.konu,gozlem:f.gozlem.trim(),karar:f.karar.trim(),takip:f.takip,ozet:f.ozet.trim(),veliNotu:f.veliNotu.trim()});save();closeModal();toast('Görüşme kaydedildi');render()},
  seviye:(f,el)=>{const id=el.dataset.id;if(f.seviye)S.riskler[id]={seviye:f.seviye,not:f.not.trim(),tarih:TODAY};else delete S.riskler[id];save();closeModal();render()},
  profil:(f,el)=>{S.profiller[el.dataset.id]={...f};save();closeModal();render()},
  plan:f=>{const adet=+f.adet;for(let i=0;i<adet;i++){const d=D(f.ilk);d.setMonth(d.getMonth()+i);S.taksitler.push({id:uid(),ogrId:f.ogrId,vade:iso(d),tutar:+f.tutar,odendi:null})}save();closeModal();toast(`${adet} taksit oluşturuldu`);render()},
  duyuru:f=>{S.duyurular.push({id:uid(),baslik:f.baslik.trim(),metin:f.metin.trim(),hedef:f.hedef,tarih:TODAY,yazar:ME(),okuyan:[]});save();closeModal();toast('Duyuru yayınlandı');render()},
  mesaj:(f,el)=>{const m=(f.metin||'').trim();if(!m)return;S.mesajlar.push({id:uid(),from:ME(),to:el.dataset.k,metin:m,zaman:nowTime(),okundu:false});O.f_kisi=el.dataset.k;saveO();save();render()},
  rtalep:f=>{const k='rehber:'+rehberId();S.mesajlar.push({id:uid(),from:ME(),to:k,metin:f.metin.trim(),zaman:nowTime(),okundu:false});save();closeModal();toast('Talebiniz rehber öğretmene iletildi');render()},
  anahtar:(f,el)=>{const s=S.sinavlar.find(x=>x.id===el.dataset.id);const t=turOf(s);const N=t.dersler.reduce((a,[,q])=>a+q,0);const an={};let uyari='';
    ['A','B','C','D'].forEach(k=>{const v=(f[k]||'').toUpperCase().replace(/[^A-EX*]/g,'');if(v){an[k]=v;if(v.length!==N)uyari=`${k} kitapçığında ${v.length} cevap var, ${N} olmalı`}});
    s.anahtar=an;save();closeModal();toast(uyari?'Kaydedildi · dikkat: '+uyari:'Cevap anahtarı kaydedildi');render()},
  karneler:(f,el)=>{const s=S.sinavlar.find(x=>x.id===el.dataset.id);const l=S.sonuclar.filter(r=>r.sinavId===s.id&&S.ogrenciler.some(o=>o.id===r.ogrId)&&(!f.sube||ogr(r.ogrId).subeId===f.sube)).map(r=>ogr(r.ogrId)).sort(subeSirali);closeModal();if(!l.length){toast('Yazdırılacak sonuç yok');return}yazdir(l.map(o=>karneHtml(o.id,s)).join(''))},
  giris:async(f,el)=>{girisHata='';const b=el.querySelector('button');b.disabled=true;b.textContent='Giriş yapılıyor…';
    const {data,error}=await sb.auth.signInWithPassword({email:EPOSTA(lower(f.k.trim())),password:f.s});
    if(error){girisHata='Kullanıcı adı ya da şifre hatalı.';render();return}await oturumAc(data.user)},
  sifrem:async f=>{if(f.s1!==f.s2){toast('İki şifre aynı değil');return}const {error}=await sb.auth.updateUser({password:f.s1});if(error){toast('Değiştirilemedi: '+error.message);return}closeModal();toast('Şifren değişti')},
  sube:f=>{S.subeler.push({id:'s'+uid(),ad:f.ad.trim(),kademe:f.kademe,alan:(f.alan||'').trim()||f.kademe});save();closeModal();toast('Şube eklendi');render()},
  ogretmen:f=>{S.ogretmenler.push({id:'t'+uid(),ad:f.ad.trim(),brans:f.brans.trim(),...(f.rehber?{rehber:true}:{})});save();closeModal();toast('Öğretmen eklendi');render()},
  ogrduzenle:(f,el)=>{const o=ogr(el.dataset.id);const no=(f.no||'').trim();if(no&&S.ogrenciler.some(x=>x.id!==o.id&&String(x.no)===no)){toast('Bu numara başka öğrencide var');return}o.ad=f.ad.trim();o.no=no;o.subeId=f.subeId;o.hedef=f.hedef.trim();const v=S.veliler.find(x=>x.id===o.veliId);if(v){if(f.veli.trim())v.ad=f.veli.trim();v.tel=(f.tel||'').trim()}save();closeModal();toast('Kaydedildi');render()},
  yonetici:async(f,el)=>{const b=el.querySelector('button');b.disabled=true;const s=sifreUret();const k=lower(f.k.trim());
    try{const r=await fn({islem:'olustur',kullanici_adi:k,sifre:s,rol:'yonetici',ref_id:'y'+uid(),ad:f.ad.trim()});HESAPLAR.push({id:r.id,kullanici_adi:k,rol:'yonetici',ref_id:'',ad:f.ad.trim()});render();bilgiGoster([{ad:f.ad.trim(),k,s}])}catch(e){b.disabled=false;toast('Oluşturulamadı: '+e.message)}},
  iceaktar:f=>{try{const d=JSON.parse(f.json);if(d.v!==1||!d.ogrenciler)throw new Error('Metin bu sisteme ait görünmüyor');S=d;save();closeModal();toast('Veri içe aktarıldı');render()}catch(err){toast('İçe aktarılamadı: '+err.message)}},
  ayarlar:f=>{S.ayarlar={...S.ayarlar,kurum:f.kurum.trim()||'Dershane',yksTarih:f.yksTarih,lgsTarih:f.lgsTarih,etutHak:Math.max(0,+f.etutHak||0)};save();toast('Ayarlar kaydedildi');render()}
};
const CHG={
  imp:(v,el)=>{const k=el.dataset.k,n=+v;if(k.startsWith('ders|')){const [,d,tp]=k.split('|');IMP.map.ders[d][tp]=n}else IMP.map[k]=n;impRender()},
  'imp-file':async(v,el)=>{const f=el.files[0];if(!f)return;const rows=await dosyaOku(f);if(!rows.length){toast('Dosyada veri bulunamadı');return}const s=S.sinavlar.find(x=>x.id===el.dataset.id);const ek=turOf(s).dersler.flatMap(([d])=>aliasOf(d).map(a=>a.split(' ')[0]));const {labels,start}=basliklar(rows,ek);IMP={sid:s.id,rows,labels,start,dosya:f.name};impOto();impRender()},
  'oakt-file':async(v,el)=>{const f=el.files[0];if(!f)return;const rows=await dosyaOku(f);if(!rows.length){toast('Dosyada veri bulunamadı');return}const {labels,start}=basliklar(rows,[]);OAKT={rows,labels,start,dosya:f.name};oaktOto();oaktRender()},
  oakt:(v,el)=>{OAKT.map[el.dataset.k]=+v;oaktRender()},
  'oakt-vsube':v=>{OAKT.varsayilanSube=v;oaktRender()},
  fbas:v=>{O.f_bas=v;saveO();render()},
  fbit:v=>{O.f_bit=v;saveO();render()},
  fsube:v=>{O.f_sube=v;saveO();render()},
  ftarih:v=>{O.f_tarih=v||TODAY;saveO();render()},
  fsinav:v=>{O.f_sinav=v;saveO();render()},
  fogt:v=>{O.f_ogt=v;saveO();render()}
};

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(!f)return;e.preventDefault();
  Promise.resolve().then(()=>f(a.dataset,a,e)).catch(err=>{console.error(err);toast('Hata: '+err.message)})});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f));
  Promise.resolve().then(()=>FORM[f.dataset.form](fd,f)).catch(err=>{console.error(err);toast('Hata: '+err.message)})});
document.addEventListener('change',e=>{const a=e.target.closest('[data-chg]');if(a&&CHG[a.dataset.chg])Promise.resolve().then(()=>CHG[a.dataset.chg](a.value,a)).catch(err=>{console.error(err);toast('Hata: '+err.message)})});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){const q=lower(t.value);document.querySelectorAll(t.dataset.filter).forEach(r=>{r.style.display=lower(r.textContent).includes(q)?'':'none'})}
  const row=t.closest('tr[data-netrow]');if(row){const T=turOf(S.sinavlar.find(x=>x.id===row.dataset.netrow));let tot=0,any=false;T.dersler.forEach(([ad])=>{const g=row.querySelector(`input[name$="|${ad}|d"]`),b=row.querySelector(`input[name$="|${ad}|y"]`);const d=parseInt(g.value,10),y=parseInt(b.value,10);if(!isNaN(d)||!isNaN(y))any=true;tot+=(isNaN(d)?0:d)-(isNaN(y)?0:y)/T.f});row.querySelector('[data-net]').textContent=any?nf(tot):'—'}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&!e.shiftKey&&e.target.closest('form.composer')){e.preventDefault();e.target.closest('form').requestSubmit()}});
$('#file-in').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.v!==1||!d.ogrenciler)throw new Error('Dosya bu sisteme ait görünmüyor');S=d;save();closeModal();toast('Veri içe aktarıldı');render()}catch(err){toast('İçe aktarılamadı: '+err.message)}e.target.value=''};rd.readAsText(file)});

window.addEventListener('beforeunload',e=>{if(ONLINE&&(syncT||syncing)){e.preventDefault();e.returnValue=''}});
window.addEventListener('focus',async()=>{if(!ONLINE||!O||!sb||syncing||syncT)return;if(Date.now()-sonYukleme<30000)return;if(!$('#modal').classList.contains('hidden'))return;
  try{await veriYukle();render()}catch(e){}});
baslat();
</script>
