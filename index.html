<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Dershane · Test Sürümü</title>
<style>
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --line:#E2E0DA; --line2:#ECEAE5;
  --text:#1C1F24; --muted:#666A71; --accent:#1F3A5F; --accent-weak:#E9EEF4;
  --ok:#2C6A44; --ok-bg:#E6F1EA; --warn:#8A520F; --warn-bg:#FBF0DF; --bad:#9C3326; --bad-bg:#F8E5E1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px;font-weight:650}
h3{font-size:15px;margin:0 0 8px;font-weight:650}
p{margin:0 0 8px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:650;color:var(--muted);margin-bottom:6px}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:650}
.badge{font-size:11px;font-weight:650;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:2px}
.who{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted)}
.wrap{display:flex;min-height:calc(100vh - 54px)}
.side{width:210px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:14.5px}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.side .cnt{font-size:12px;background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;line-height:18px}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}
main{flex:1;padding:26px 30px 60px;max-width:1120px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.card.flush{padding:0}
.card.flush > h2{padding:16px 18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2 > .card,.grid3 > .card{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .n{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#C9C6BE}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark,#18304F)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.link:hover{color:var(--text);text-decoration:underline}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFAF8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.n{background:var(--bg);color:var(--muted)}
.tag.acc{background:var(--accent-weak);color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line2)}
.list li:last-child{border-bottom:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:#3B3F46}
input,select,textarea{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--text);width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.field{margin-bottom:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.inline-sel{width:auto;padding:5px 8px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.yk button{border:1px solid var(--line);background:#fff;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;border-radius:5px;color:var(--muted)}
.yk button.on.var{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.yk button.on.gec{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.yk button.on.yok{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.scale{display:flex;gap:6px}
.scale label{margin:0}
.scale input{display:none}
.scale span{display:inline-block;width:42px;height:38px;line-height:36px;text-align:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:600;background:#fff}
.scale input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.big{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.note{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font-size:13.5px;color:#4A4E55}
.msg-wrap{display:grid;grid-template-columns:260px 1fr;min-height:460px}
.msg-list{border-right:1px solid var(--line);overflow-y:auto;max-height:620px}
.msg-list a{display:block;padding:10px 14px;border-bottom:1px solid var(--line2);text-decoration:none;color:var(--text)}
.msg-list a.on{background:var(--accent-weak)}
.msg-list a span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column}
.bubbles{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:520px}
.bub{max-width:75%;padding:8px 12px;border-radius:8px;background:var(--bg);font-size:14.5px}
.bub.me{align-self:flex-end;background:var(--accent-weak)}
.bub time{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.composer textarea{min-height:42px}
.login{min-height:100vh;display:flex;justify-content:center;padding:48px 20px}
.login-in{width:100%;max-width:860px}
.login h2{margin-top:26px;font-size:14px;color:var(--muted);font-weight:650;letter-spacing:.02em}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pick{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit}
.pick:hover{border-color:var(--accent)}
.pick b{display:block;font-weight:600;font-size:14.5px}
.pick span{font-size:12.5px;color:var(--muted)}
.banner{background:#FFFBF2;border:1px solid #EFE3C8;color:#6B5320;border-radius:6px;padding:9px 12px;font-size:13.5px;margin-bottom:18px}
.modal{position:fixed;inset:0;background:rgba(20,24,30,.35);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:20;overflow-y:auto}
.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:10px;border:1px solid var(--line);width:100%;max-width:560px;padding:20px 22px}
.modal-box .between{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.week td,.week th{text-align:left;vertical-align:top}
.slot{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:13.5px;background:#fff}
.slot b{display:block;font-weight:600}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slotbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:118px;text-align:left}
.slotbtn small{display:block;color:var(--muted);font-size:12px}
.slotbtn:hover{border-color:var(--accent)}
.slotbtn.full{background:var(--bg);color:var(--muted);cursor:default}
.slotbtn.mine{border-color:var(--accent);background:var(--accent-weak)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.back{display:inline-block;margin-bottom:10px;font-size:14px;text-decoration:none}
details summary{cursor:pointer;font-weight:600;font-size:14px}
#print-area{display:none}
.av{border-radius:50%;object-fit:cover;vertical-align:middle;flex:none;display:inline-block}
.av.ini{display:inline-flex;align-items:center;justify-content:center;background:var(--accent-weak);color:var(--accent);font-weight:650;letter-spacing:.02em}
.who .av{cursor:pointer}
label.chk{display:inline-flex;gap:6px;align-items:center;font-weight:400;font-size:14px;margin:0;color:var(--text)}
label.chk input{width:auto}
.hedef{border:1px solid var(--line);border-radius:8px;padding:6px 12px;max-height:340px;overflow-y:auto}
.hg{padding:6px 0;border-bottom:1px solid var(--line2)}.hg:last-child{border-bottom:none}
.hl{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.04em;margin-bottom:4px;text-transform:uppercase}
.hk{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow-y:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:1px 8px;font-size:13px;margin:1px 0}
.chip .link{font-size:15px;line-height:1}
.list li.yeni{background:#FBFAF5;margin:0 -18px;padding-left:18px;padding-right:18px;border-left:3px solid var(--accent)}
pre.optik{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px;font-size:12px;overflow-x:auto;line-height:1.35;margin:0 0 10px}
.surum{position:sticky;top:0;z-index:40;background:var(--accent);color:#fff;text-align:center;padding:7px;font-size:14px}.surum a{color:#fff;font-weight:650}.surum.hidden{display:none}
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit;font-size:14px;color:var(--text)}
.bell .cnt{position:absolute;top:-7px;right:-7px;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 5px;line-height:17px}
.rolsel{width:auto;padding:3px 6px;font-size:13px}
.bub .kim{display:block;font-size:12px;font-weight:650;color:var(--accent);margin-bottom:1px}
.msg-tabs{display:flex;border-bottom:1px solid var(--line)}.msg-tabs button{flex:1;border:none;background:none;padding:9px;font:inherit;font-size:14px;cursor:pointer;color:var(--muted)}.msg-tabs button.on{color:var(--accent);font-weight:650;box-shadow:inset 0 -2px 0 var(--accent)}
.msg-list a.grp b::before{content:'# ';color:var(--muted)}
.msg-list a span.tag{display:inline-block}
.cevrim{background:#9A3B2E}
table.takvim{table-layout:fixed}table.takvim th{text-align:center;font-size:12px}
td.tk{vertical-align:top;height:92px;padding:4px 5px;border:1px solid var(--line2)}td.tk.dis{background:#FAFAF7;color:var(--muted)}td.tk.tatil{background:#F4F1EA}td.tk.bugun .tg{background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;display:inline-block}
.tg{font-size:12px;font-weight:650;margin-bottom:3px}
.te{font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:#EEF2F7;color:#1F3A5F}
.te.deneme{background:#E7EEF7;color:#1F3A5F;border-left:3px solid #1F3A5F}.te.tatil{background:#ECEAE4;color:#5C5A55}.te.veli,.te.toplanti{background:#F5EEDC;color:#7A5A12}.te.etkinlik{background:#E5F1EA;color:#25603F}.te.sinav{background:#F6E6E3;color:#8A2F22}
i.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}i.lg.deneme{background:#1F3A5F}i.lg.tatil{background:#C9C5BB}i.lg.veli{background:#D9B95C}i.lg.etkinlik{background:#5E9C77}i.lg.sinav{background:#C46A5A}
.surec{display:inline-flex;gap:3px;vertical-align:middle}.surec i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}.surec i.on{background:var(--ok,#3B7A57)}
tr.buhafta td{background:#FBF7EA}
.grid2>*,.grid3>*,.stats>*{min-width:0}

function risk(id){
  const sig=[];const dv=devamsizlik(id);if(dv.yok>=3)sig.push(`Son 14 günde ${dv.yok} ders devamsızlık`);
  const ch=S.checkinler.filter(c=>c.ogrId===id).sort((a,b)=>a.tarih<b.tarih?1:-1);
  if(ch.length>=2&&(ch[0].genel+ch[1].genel)/2<=2)sig.push('İki haftadır düşük check-in');
  if(ch[0]&&ch[0].stres>=5&&daysBetween(ch[0].tarih,TODAY)<=10)sig.push('Yüksek sınav stresi bildirdi');
  if(ch[0]&&ch[0].gorusme&&daysBetween(ch[0].tarih,TODAY)<=10)sig.push('Görüşmek istediğini belirtti');
  const ss0=ogrSinavlar(id);const ss=ss0.length?ayniTur(ss0,ss0[ss0.length-1]):[];if(ss.length>=2){const a=toplamNet(sonucOf(ss[ss.length-2].id,id),ss[ss.length-2]),b=toplamNet(sonucOf(ss[ss.length-1].id,id),ss[ss.length-1]);if(b-a<=-5)sig.push(`Son denemede ${nf(b-a)} net`)}
  const odv=S.odevler.filter(h=>h.subeId===ogr(id).subeId&&h.sonTarih<TODAY);if(odv.length&&odv.filter(h=>h.teslim[id]!=='yapti').length===odv.length&&odv.length>=1&&odv.some(h=>h.teslim[id]==='eksik'))sig.push('Ödevleri eksik');
  const m=S.riskler[id];return {seviye:m?m.seviye:(sig.length?'sari':'yesil'),sig,manuel:!!m,not:m?m.not:''};
}

function trendSvg(vals,labels){
  if(vals.length<2)return '<p class="empty">Trend için en az iki deneme gerekiyor.</p>';
  const W=640,H=170,pl=36,pr=14,pt=14,pb=28;const mn=Math.floor(Math.min(...vals)-3),mx=Math.ceil(Math.max(...vals)+3);
  const x=i=>pl+i*(W-pl-pr)/(vals.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn||1));
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let g='';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line2)"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" style="fill:var(--muted)" text-anchor="end">${Math.round(v)}</text>`}
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3.5}" style="fill:var(--accent)"/><text x="${x(i)}" y="${H-8}" font-size="11" style="fill:var(--muted)" text-anchor="middle">${esc(labels[i])}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Net trendi">${g}<polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="2.5"/>${dots}</svg>`;
}

function ogrDetay(id){

  const hd=hedefDurum(id);

PAGES.bugun=()=>{
  const ds=S.dersler.filter(d=>d.gun===wd(TODAY)&&dersBilgi(d).ogretmenId===O.id).sort((a,b)=>dersBilgi(a).saat<dersBilgi(b).saat?-1:1);
  const eks=eksikYoklamalar(7,O.id).filter(x=>x.k==='alinmadi'||x.k==='bekleniyor');const gv=gorevlerim().filter(g=>g.durum!=='onaylandi'&&g.durum!=='onayda');
  const et=S.etutler.filter(e=>e.ogretmenId===O.id&&e.tarih>=TODAY&&e.ogr.length).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1).slice(0,5);
  const od=S.odevler.filter(h=>h.ogretmenId===O.id&&h.sonTarih>=addDays(TODAY,-3));
  return head(`Günaydın, ${esc(ogt(O.id).ad.split(' ')[0])}`,`${GUN[wd(TODAY)]}, ${fd(TODAY)}`)+
  (eks.length?`<div class="banner"><b>Girilmeyen yoklama:</b> ${eks.map(x=>`<a href="#" data-act="yk-ac" data-id="${x.d.id}" data-tarih="${x.t}">${x.t===TODAY?'Bugün':fds(x.t)} ${dersBilgi(x.d,x.t).saat} ${esc(sube(x.d.subeId).ad)} ${esc(x.d.ders)}</a>`).join(' · ')}</div>`:'')+
  (gv.length?`<div class="card"><div class="between"><h2 style="margin:0">Görevlerim</h2><a href="#" class="small" data-act="go" data-page="gorevler">Tümü</a></div><table style="margin-top:8px">${gv.slice(0,4).map(g=>`<tr class="click" data-act="go" data-page="gorevler:${g.id}"><td><b>${esc(g.baslik)}</b></td><td>${g.sonTarih?fds(g.sonTarih):''}${g.sonTarih&&g.sonTarih<TODAY?' <span class="tag bad">Gecikti</span>':''}</td><td>${gdurTag(g.durum)}</td></tr>`).join('')}</table></div>`:'')+
  `<div class="grid2"><div class="card"><h2>Bugünkü derslerim</h2>${ds.length?`<table>${ds.map(d=>{const b=dersBilgi(d);const y=S.yoklamalar.find(x=>x.dersId===d.id&&x.tarih===TODAY);const dd=dersDurum(d.id);return `<tr><td><b>${b.saat}</b></td><td>${sube(d.subeId).ad} · ${esc(d.ders)} ${ddTag(d)}</td><td class="num"><div class="row" style="justify-content:flex-end">${b.iptal?'':!dd?`<button class="btn sm" data-act="ders-basladi" data-id="${d.id}">Başladı</button>`:''}<button class="btn sm" data-act="ders-durum" data-id="${d.id}">Durum</button>${b.iptal?'':`<button class="btn sm ${y?'':'primary'}" data-act="yk-ac" data-id="${d.id}">${y?'Yoklama alındı':'Yoklama al'}</button>`}</div></td></tr>`}).join('')}</table>`:empty('Bugün dersin yok.')}</div>
  <div class="card"><h2>Yaklaşan etüt randevuları</h2>${et.length?`<table>${et.map(e=>`<tr><td>${fds(e.tarih)} ${e.saat}</td><td>${e.ogr.map(i=>esc(ogr(i).ad)).join(', ')}</td></tr>`).join('')}</table>`:empty('Randevu yok.')}</div></div>
  <div class="card" style="margin-top:16px"><h2>Ödev durumu</h2>${od.length?`<table>${od.map(h=>{const n=S.ogrenciler.filter(o=>o.subeId===h.subeId).length;const y=Object.values(h.teslim).filter(v=>v==='yapti').length;return `<tr class="click" data-act="go" data-page="odevler:${h.id}"><td><b>${esc(h.baslik)}</b></td><td>${sube(h.subeId).ad}</td><td>${fds(h.sonTarih)}</td><td class="num">${y}/${n} yaptı</td></tr>`}).join('')}</table>`:empty('Aktif ödev yok.')}</div>`;
};

/* Denemeler */
const denemeYetki=()=>['yonetici','rehber'].includes(O.role);
PAGES.denemeler=arg=>{
  if(arg)return denemeDetay(arg);
  const list=[...S.sinavlar].filter(s=>denemeYetki()||S.dersler.some(d=>d.ogretmenId===O.id&&s.subeler.includes(d.subeId))).sort((a,b)=>a.tarih<b.tarih?1:-1);
  return head('Denemeler',`${list.length} deneme`,denemeYetki()?`<button class="btn primary" data-act="den-yeni">Yeni deneme</button>`:'')+
  `<div class="card flush"><div class="tw"><table><tr><th>Deneme</th><th>Tür</th><th>Tarih</th><th>Yayınevi</th><th>Şubeler</th><th class="num">Katılım</th><th class="num">Ortalama</th><th>Süreç</th></tr>
  ${list.map(s=>{const rr=S.sonuclar.filter(r=>r.sinavId===s.id);const avg=rr.length?rr.reduce((a,r)=>a+toplamNet(r,s),0)/rr.length:0;return `<tr class="click" data-act="go" data-page="denemeler:${s.id}"><td><b>${esc(s.ad)}</b></td><td>${esc(turAd(s))}</td><td>${fd(s.tarih)}</td><td>${esc(s.yayinevi||'')}</td><td class="muted">${s.subeler.map(x=>sube(x).ad).join(', ')}</td><td class="num">${rr.length}</td><td class="num">${rr.length?nf(avg):'—'}</td><td>${surecNokta(s)}</td></tr>`}).join('')||`<tr><td colspan="8">${empty('Henüz deneme yok.')}</td></tr>`}</table></div></div>`;
};
const subeSirali=(a,b)=>(sube(a.subeId).ad+a.ad).localeCompare(sube(b.subeId).ad+b.ad,'tr');
function denemeDetay(id){
  const s=S.sinavlar.find(x=>x.id===id);if(!s)return empty('Deneme bulunamadı.');const t=turOf(s);const yetki=denemeYetki();
  const ogs=S.ogrenciler.filter(o=>s.subeler.includes(o.subeId)).sort(subeSirali);const rr=S.sonuclar.filter(r=>r.sinavId===id);
  const sirali=rr.filter(r=>S.ogrenciler.some(o=>o.id===r.ogrId)).map(r=>({r,n:toplamNet(r,s)})).sort((a,b)=>b.n-a.n);
  const anahtarN=s.anahtar?Object.keys(s.anahtar).filter(k=>s.anahtar[k]).length:0;
  let h=`<a href="#" class="back" data-act="go" data-page="denemeler">← Denemeler</a>`+head(esc(s.ad),`${esc(turAd(s))} · ${fd(s.tarih)} · ${s.subeler.map(x=>sube(x).ad).join(', ')||'şube yok'} · ${rr.length} sonuç`,
    (yetki?`<button class="btn primary" data-act="imp-ac" data-id="${id}">Dosyadan yükle</button><button class="btn" data-act="anahtar" data-id="${id}">Cevap anahtarı${anahtarN?' ('+anahtarN+')':''}</button>`:'')+
    (!yetki&&t.dersler.some(([d])=>kazanimYetki(d))?`<button class="btn primary" data-act="konu-esle" data-id="${id}">Kazanımları gir</button>`:'')+`<button class="btn" data-act="den-excel" data-id="${id}">Excel</button>`+(rr.length?`<button class="btn" data-act="karneler" data-id="${id}">Karneleri yazdır</button>`:'')+
    (yetki?`<button class="btn" data-act="den-yayin" data-id="${id}">${s.yayinda?'Yayından kaldır':'Sonuçları yayınla'}</button><button class="btn danger" data-act="den-sil" data-id="${id}">Sil</button>`:''));
  h+=surecKart(s,yetki);
  if(yetki&&!s.yayinda)h+=`<div class="banner">Bu deneme taslakta: öğrenci ve veliler sonuçları göremez. Kontrol ettikten sonra “Sonuçları yayınla” de; velilere bildirim gider.</div>`;
  const ort=t.dersler.map(([ad,q])=>{const v=rr.length?rr.reduce((a,r)=>a+dersNet(r.c[ad],t.f),0)/rr.length:0;return `<div class="stat"><div class="l">${esc(ad)}</div><div class="n">${nf(v)}</div><div class="s">ortalama / ${q} soru</div></div>`}).join('');
  h+=`<div class="stats">${ort}</div>`;
  if(rr.length&&s.subeler.length>1)h+=`<div class="card flush"><h2>Şube ortalamaları</h2><div class="tw"><table><tr><th>Şube</th><th class="num">Katılım</th>${t.dersler.map(([ad])=>`<th class="num">${esc(ad)}</th>`).join('')}<th class="num">Toplam</th></tr>${s.subeler.map(sb=>{const l=rr.filter(r=>ogr(r.ogrId).subeId===sb);if(!l.length)return '';const av=f=>nf(l.reduce((a,r)=>a+f(r),0)/l.length);return `<tr><td><b>${sube(sb).ad}</b></td><td class="num">${l.length}</td>${t.dersler.map(([ad])=>`<td class="num">${av(r=>dersNet(r.c[ad],t.f))}</td>`).join('')}<td class="num"><b>${av(r=>toplamNet(r,s))}</b></td></tr>`}).join('')}</table></div></div>`;
  if(yetki){
    h+=`<details class="card" ${rr.length?'':'open'}><summary>Elle sonuç girişi (${ogs.length} öğrenci)</summary><p class="small muted" style="margin:8px 0">D: doğru, Y: yanlış · ${t.f?`net = D − Y/${t.f}`:'yanlış doğruyu götürmez'} · Kalabalık listeler için “Dosyadan yükle” daha hızlı.</p>
    <form data-form="sonuc" data-id="${id}"><div class="tw"><table><tr><th>Öğrenci</th>${t.dersler.map(([ad,q])=>`<th>${esc(ad)} <span class="muted">(${q})</span></th>`).join('')}<th class="num">Net</th></tr>
    ${ogs.map(o=>{const r=rr.find(x=>x.ogrId===o.id);return `<tr data-netrow="${s.id}"><td><b>${esc(o.ad)}</b><br><span class="small muted">${sube(o.subeId).ad}${o.no?' · '+esc(o.no):''}</span></td>${t.dersler.map(([ad,q])=>{const c=r&&r.c[ad]||{};return `<td><div class="row" style="flex-wrap:nowrap;gap:4px"><input name="${o.id}|${ad}|d" value="${c.d==null?'':c.d}" inputmode="decimal" placeholder="D" style="width:52px;padding:5px"><input name="${o.id}|${ad}|y" value="${c.y==null?'':c.y}" inputmode="numeric" placeholder="Y" style="width:52px;padding:5px"></div></td>`}).join('')}<td class="num"><b data-net>${r?nf(toplamNet(r,s)):'—'}</b></td></tr>`}).join('')||`<tr><td colspan="9">${empty('Bu denemeye şube eklenmemiş.')}</td></tr>`}</table></div><button class="btn primary" type="submit" style="margin-top:10px">Sonuçları kaydet</button></form></details>`;
  }
  h+=konuKart(s);
  h+=`<div class="card flush" style="margin-top:16px"><h2>Sıralama</h2><div class="tw"><table><tr><th class="num">Kurum</th><th class="num">Sınıf</th><th>No</th><th>Öğrenci</th><th>Şube</th>${t.dersler.map(([ad])=>`<th class="num">${esc(ad)}</th>`).join('')}<th class="num">Toplam</th></tr>
  ${sirali.map(x=>{const o=ogr(x.r.ogrId);const sr=siralar(s,x.r.ogrId);return `<tr><td class="num">${x.r.sira||''}</td><td class="num">${sr?sr.sinif+'/'+sr.sinifN:''}</td><td class="muted">${esc(o.no||'')}</td><td>${esc(o.ad)}</td><td>${sube(o.subeId).ad}</td>${t.dersler.map(([ad])=>`<td class="num">${nf(dersNet(x.r.c[ad],t.f))}</td>`).join('')}<td class="num"><b>${nf(x.n)}</b></td></tr>`}).join('')||`<tr><td colspan="13">${empty('Henüz sonuç yok. “Dosyadan yükle” ile Excel ya da CSV dosyası yükleyebilirsin.')}</td></tr>`}</table></div></div>`;
  return h;
}

/* Karne */
PAGES.karne=()=>{
  const id=aktifOgr();const o=ogr(id);const ss=ogrSinavlar(id);
  let h=(O.role==='veli'?cocukSec():'')+head(O.role==='veli'?`${esc(o.ad.split(' ')[0])} · Karne`:'Karnem',`${sube(o.subeId).ad} · Hedef: ${esc(o.hedef)}`);
  if(!ss.length)return h+`<div class="card">${empty('Henüz yayınlanmış deneme sonucu yok.')}</div>`;
  const secId=ss.some(s=>s.id===O.f_sinav)?O.f_sinav:ss[ss.length-1].id;const i=ss.findIndex(s=>s.id===secId);const s=ss[i];const r=sonucOf(s.id,id);const n=toplamNet(r,s);
  const ssT=ayniTur(ss,s).filter(x=>x.tarih<=s.tarih);const pv=ssT[ssT.length-2];const onc=pv?n-toplamNet(sonucOf(pv.id,id),pv):null;
  const tumN=S.sonuclar.filter(x=>x.sinavId===s.id).map(x=>toplamNet(x,s)).sort((a,b)=>b-a);const sira=r.sira||(tumN.findIndex(v=>v<=n+1e-9)+1);const tum={length:r.katilim||tumN.length};
  const zd=zayifDersler(r,s);
  h+=`<div class="card"><div class="row"><select class="inline-sel" data-chg="fsinav">${ss.map(x=>opt(x.id,x.ad+' · '+fds(x.tarih),secId)).join('')}</select><button class="btn" data-act="karne-yazdir" data-id="${s.id}" data-ogr="${id}">Yazdır / PDF</button><button class="btn" data-act="go" data-page="ortakkarne">Ortak karne</button></div></div>
  <div class="grid3"><div class="card"><div class="muted small">Toplam net</div><div class="big">${nf(n)}</div>${onc!==null?`<p class="small" style="margin-top:6px"><span class="tag ${onc>=0?'acc':'warn'}">${onc>=0?'+':''}${nf(onc)} net</span> önceki denemeye göre</p>`:''}</div>
  <div class="card"><div class="muted small">Kurum sırası · Sınıf sırası</div><div class="big">${sira} <span class="muted" style="font-size:18px">/ ${tum.length}</span> <span style="font-size:22px">· ${(siralar(s,id)||{}).sinif||'—'}</span><span class="muted" style="font-size:16px">/${(siralar(s,id)||{}).sinifN||'—'}</span></div><p class="small muted" style="margin-top:6px">${(()=>{const pu=puanOf(Object.fromEntries(turOf(s).dersler.map(([d])=>[d,dersNet(r.c[d],turOf(s).f)])),s);return pu!=null?'Tahmini puan: <b>'+nf(pu)+'</b>':'Kıyas ikinci planda; önemli olan kendi gelişimin.'})()}</p></div>
  <div class="card"><div class="muted small">Bu hafta önceliğin</div><p style="font-size:18px;font-weight:600;margin:4px 0 8px">${zd.join(' ve ')}</p>${O.role==='ogrenci'&&S.ayarlar.etutTalep!==false?`<button class="btn sm primary" data-act="talep-yeni">Etüt talep et</button>`:'<p class="small muted">Etüt planlamasını rehber öğretmen yapar.</p>'}</div></div>
  <div class="grid2" style="margin-top:16px"><div class="card"><h2>Ders bazında</h2>${dersBars(r,s)}</div><div class="card"><h2>Gelişim · ${esc(turAd(s))}</h2>${trendSvg(ssT.map(x=>toplamNet(sonucOf(x.id,id),x)),ssT.map(x=>x.ad.replace(/^\D+/,'D')))}</div></div>`+ogrKonuHtml(id,s);
  return h;
};

/* Ödevler (öğretmen) */
PAGES.odevler=arg=>{
  if(arg){const hw=S.odevler.find(x=>x.id===arg);if(!hw)return empty('Ödev bulunamadı.');const ogs=S.ogrenciler.filter(o=>o.subeId===hw.subeId);
    return `<a href="#" class="back" data-act="go" data-page="odevler">← Ödevler</a>`+head(esc(hw.baslik),`${sube(hw.subeId).ad} · son tarih ${fd(hw.sonTarih)}`,`<button class="btn" data-act="odev-hepsi" data-id="${hw.id}">İşaretlenmeyenler: Yaptı</button><button class="btn danger" data-act="odev-sil" data-id="${hw.id}">Sil</button>`)+
    `<div class="card"><p>${esc(hw.aciklama)}</p><p class="small muted">“Eksik” ya da “Yapmadı” işaretlenince öğrenciye ve velisine bildirim gider.</p></div><div class="card flush"><table>${ogs.map(o=>{const st=hw.teslim[o.id]||'bekliyor';return `<tr><td>${av('ogrenci:'+o.id,o.ad,26)} <b>${esc(o.ad)}</b></td><td class="num"><div class="seg">${[['yapti','Yaptı'],['eksik','Eksik'],['yapmadi','Yapmadı'],['bekliyor','Bekliyor']].map(([k,l])=>`<button class="${st===k?'on':''}" data-act="odev-st" data-id="${hw.id}" data-ogr="${o.id}" data-v="${k}">${l}</button>`).join('')}</div></td></tr>`}).join('')}</table></div>`}
  const list=S.odevler.filter(h=>h.ogretmenId===O.id).sort((a,b)=>a.sonTarih<b.sonTarih?1:-1);
  return head('Ödevler','',`<button class="btn primary" data-act="odev-yeni">Yeni ödev</button>`)+`<div class="card flush"><table><tr><th>Ödev</th><th>Şube</th><th>Son tarih</th><th class="num">Yaptı</th><th class="num">Eksik</th><th class="num">Yapmadı</th><th class="num">Bekliyor</th></tr>${list.map(h=>{const og=S.ogrenciler.filter(o=>o.subeId===h.subeId);const c=k=>og.filter(o=>(h.teslim[o.id]||'bekliyor')===k).length;return `<tr class="click" data-act="go" data-page="odevler:${h.id}"><td><b>${esc(h.baslik)}</b></td><td>${sube(h.subeId).ad}</td><td>${fd(h.sonTarih)}</td><td class="num">${c('yapti')}</td><td class="num">${c('eksik')||''}</td><td class="num">${c('yapmadi')||''}</td><td class="num">${c('bekliyor')||''}</td></tr>`}).join('')||`<tr><td colspan="4">${empty('Henüz ödev vermedin.')}</td></tr>`}</table></div>`;
};
PAGES.odevlerim=()=>{
  const o=ogr(O.id);const list=S.odevler.filter(h=>h.subeId===o.subeId).sort((a,b)=>a.sonTarih<b.sonTarih?-1:1);
  return head('Ödevlerim','Ödevini öğretmenin kontrol edip işaretler.')+`<div class="card flush"><table><tr><th>Ödev</th><th>Öğretmen</th><th>Son tarih</th><th>Durum</th><th></th></tr>${list.map(h=>{const st=h.teslim[O.id];return `<tr><td><b>${esc(h.baslik)}</b><br><span class="small muted">${esc(h.aciklama)}</span></td><td class="muted">${esc(ogt(h.ogretmenId).ad)}</td><td>${fd(h.sonTarih)}${h.sonTarih<TODAY&&st!=='yapti'?' <span class="tag bad">Geçti</span>':''}</td><td>${st==='yapti'?'<span class="tag ok">Yaptı</span>':st==='eksik'?'<span class="tag warn">Eksik</span>':st==='yapmadi'?'<span class="tag bad">Yapmadı</span>':'<span class="tag n">Kontrol bekleniyor</span>'}</td><td></td></tr>`}).join('')||`<tr><td colspan="5">${empty('Ödev yok.')}</td></tr>`}</table></div>`;
};

/* Etüt */
PAGES.etut=()=>{
  if(O.role==='yonetici'){
    const up=S.etutler.filter(e=>e.tarih>=TODAY);
    return head('Etüt','Öğretmenlerin açtığı etüt saatleri ve doluluk')+`<div class="card flush"><table><tr><th>Öğretmen</th><th class="num">Açık saat</th><th class="num">Dolu</th><th class="num">Doluluk</th></tr>${S.ogretmenler.filter(t=>!t.rehber).map(t=>{const m=up.filter(e=>e.ogretmenId===t.id);const d=m.filter(e=>e.ogr.length>=e.kontenjan).length;return `<tr><td><b>${esc(t.ad)}</b> <span class="muted">${esc(t.brans)}</span></td><td class="num">${m.length}</td><td class="num">${d}</td><td class="num">${m.length?'%'+Math.round(d/m.length*100):'—'}</td></tr>`}).join('')}</table></div>`;
  }
  const mine=S.etutler.filter(e=>e.ogretmenId===O.id&&e.tarih>=TODAY).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);const gunler=[...new Set(mine.map(e=>e.tarih))];
  return head('Etütlerim','Rehberin planladığı etütler ve senin açtığın saatler; rehber boş saatlere öğrenci atar.',`<button class="btn primary" data-act="etut-yeni">Saat ekle</button>`)+
  (gunler.map(g=>`<div class="card"><h3>${GUN[wd(g)]}, ${fd(g)}</h3><table>${mine.filter(e=>e.tarih===g).map(e=>`<tr><td style="width:80px"><b>${e.saat}</b></td><td>${e.ogr.length?e.ogr.map(i=>esc(ogr(i).ad)).join(', '):'<span class="muted">Boş</span>'}</td><td class="muted small">${e.ogr.length}/${e.kontenjan}</td><td class="num">${e.ogr.length?'':`<button class="link" data-act="etut-sil" data-id="${e.id}">Kaldır</button>`}</td></tr>`).join('')}</table></div>`).join('')||`<div class="card">${empty('Açık etüt saatin yok.')}</div>`);
};
PAGES.etutal=()=>{
  const ft=O.f_ogt||'';const ws=weekStart(TODAY),we=addDays(ws,6);const hak=S.ayarlar.etutHak;
  const benim=S.etutler.filter(e=>e.ogr.includes(O.id)&&e.tarih>=TODAY).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);
  const buHafta=S.etutler.filter(e=>e.ogr.includes(O.id)&&e.tarih>=ws&&e.tarih<=we).length;
  const ac=S.etutler.filter(e=>e.tarih>=TODAY&&(!ft||e.ogretmenId===ft)).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);const gunler=[...new Set(ac.map(e=>e.tarih))];
  return head('Etüt al',`Bu hafta ${Math.max(0,hak-buHafta)} etüt hakkın kaldı (haftalık ${hak})`,`<select class="inline-sel" data-chg="fogt">${opt('','Tüm öğretmenler',ft)}${S.ogretmenler.filter(t=>!t.rehber).map(t=>opt(t.id,t.ad+' · '+t.brans,ft)).join('')}</select>`)+
  (benim.length?`<div class="card"><h2>Randevularım</h2><table>${benim.map(e=>`<tr><td>${GUN[wd(e.tarih)]} ${fds(e.tarih)}, <b>${e.saat}</b></td><td>${esc(ogt(e.ogretmenId).ad)} · ${esc(ogt(e.ogretmenId).brans)}</td><td class="num"><button class="btn sm" data-act="etut-iptal" data-id="${e.id}">İptal et</button></td></tr>`).join('')}</table></div>`:'')+

function kisiler(){
  const r=O.role,L=[];const k=t=>(t.rehber?'rehber:':'ogretmen:')+t.id;
  const subOgt=subs=>S.ogretmenler.filter(t=>t.rehber||S.dersler.some(d=>d.ogretmenId===t.id&&subs.includes(d.subeId)));
  if(r==='veli'){subOgt(veli(O.id).cocuklar.map(c=>ogr(c).subeId)).forEach(t=>L.push(k(t)));L.push(yonetimKeys()[0])}
  if(r==='ogrenci'){subOgt([ogr(O.id).subeId]).forEach(t=>L.push(k(t)))}
  if(r==='ogretmen'){const subs=[...new Set(S.dersler.filter(d=>d.ogretmenId===O.id).map(d=>d.subeId))];S.ogrenciler.filter(o=>subs.includes(o.subeId)).forEach(o=>{veliKeys(o).forEach(x=>L.push(x));L.push('ogrenci:'+o.id)});S.ogretmenler.filter(t=>t.id!==O.id).forEach(t=>L.push(k(t)));yonetimKeys().forEach(x=>L.push(x))}
  if(r==='rehber'){S.ogrenciler.forEach(o=>{L.push('ogrenci:'+o.id);veliKeys(o).forEach(x=>L.push(x))});S.ogretmenler.filter(t=>t.id!==O.id).forEach(t=>L.push(k(t)));yonetimKeys().forEach(x=>L.push(x))}
  if(r==='yonetici'){yonetimKeys().forEach(x=>L.push(x));S.ogretmenler.forEach(t=>L.push(k(t)));aktifVeliler().forEach(v=>L.push('veli:'+v.id))}
  S.mesajlar.forEach(m=>{if(benim(m.to))L.push(m.from);if(benim(m.from))L.push(m.to)});
  return [...new Set(L)].filter(x=>x&&!benim(x));
}

const ALT={d:'d',dogru:'d',y:'y',yanlis:'y',n:'n',net:'n',b:'b',bos:'b'};

function basliklar(rows,ekKelime){
  const kel=new Set(['ad','adi','soyad','soyadi','isim','ogrenci','no','numara','sube','sinif','d','y','n','b','dogru','yanlis','net','bos','kitapcik','cevap','cevaplar','veli','telefon','tel','hedef','gsm',...ekKelime]);
  let best=0,bs=-1;
  for(let i=0;i<Math.min(15,rows.length);i++){const sc=rows[i].filter(c=>{const n=norm(c);return n&&n.split(' ').some(w=>kel.has(w))}).length;if(sc>bs){bs=sc;best=i}}
  const altMi=r=>{const d=(r||[]).filter(c=>norm(c));return d.length>=2&&d.filter(c=>ALT[norm(c)]).length>=d.length*0.6};
  if(best>0&&altMi(rows[best])&&(rows[best-1]||[]).some(c=>norm(c)))best--;
  const h=rows[best]||[],nx=rows[best+1]||[];
  const nxDolu=nx.filter(c=>norm(c));const iki=nxDolu.length>=2&&nxDolu.filter(c=>ALT[norm(c)]).length>=nxDolu.length*0.6;
  const w=Math.max(...rows.slice(best,best+8).map(r=>r.length),0);const labels=[];let carry='';

  return {labels,start:best+(iki?2:1)};
}
function kolonCoz(label){let w=norm(label).split(' ').filter(x=>x&&!GURULTU.has(x));if(!w.length)return null;let tip=null;

      const cv=(m.cevap>=0?String(r[m.cevap]==null?'':r[m.cevap]):'').replace(/[\r\n]+$/,'').toUpperCase();if(!cv.trim())return;dolu=true;let p=0;cevK={kit,s:cv.slice(0,t.dersler.reduce((a,[,q])=>a+q,0))};

    if(m.tel2<0&&RX2.tel2.test(n))return m.tel2=c;if(m.veli2<0&&RX2.veli2.test(n))return m.veli2=c;
    if(m.tc<0&&RX2.tc.test(n))return m.tc=c;if(m.dogum<0&&RX2.dogum.test(n))return m.dogum=c;if(m.okul<0&&RX2.okul.test(n))return m.okul=c;if(m.sinif<0&&RX2.sinif.test(n))return m.sinif=c;if(m.adres<0&&RX2.adres.test(n))return m.adres=c;
    if(m.no<0&&RX.no.test(n))return m.no=c;if(m.veli<0&&RX.veli.test(n))return m.veli=c;if(m.tel<0&&RX.tel.test(n))return m.tel=c;if(m.sube<0&&RX.sube.test(n))return m.sube=c;
    if(m.hedef<0&&RX.hedef.test(n))return m.hedef=c;if(m.soyad<0&&RX.soyad.test(n))return m.soyad=c;if(m.ad<0&&RX.ad.test(n))return m.ad=c});

function subeBul(ad){const n=norm(ad);return S.subeler.find(s=>norm(s.ad)===n)}
function tarihOku(v){if(v==null||v==='')return '';const ok=(y,m,d)=>y>1900&&y<2100&&m>=1&&m<=12&&d>=1&&d<=31?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:'';
  if(typeof v==='number'&&v>1000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return ok(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
  if(v instanceof Date&&!isNaN(v))return ok(v.getFullYear(),v.getMonth()+1,v.getDate());const s=String(v).trim();
  let m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);if(m)return ok(+m[1],+m[2],+m[3]);m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/);if(m)return ok(+m[3],+m[2],+m[1]);
  if(/^\d{4,5}(\.0)?$/.test(s))return tarihOku(+s);return ''}
function sinifOku(v,sb){const s=norm(v);if(s.includes('mezun'))return 'Mezun';let m=s.match(/\d{1,2}/);if(m&&SINIFLAR.includes(String(+m[0])))return String(+m[0]);m=String(sb||'').match(/^\s*(\d{1,2})(?!\d)/);if(m&&SINIFLAR.includes(String(+m[1])))return String(+m[1]);return ''}
function oaktHesap(){const m=OAKT.map;const h=(r,c)=>c>=0?String(r[c]==null?'':r[c]).trim():'';const ham=(r,c)=>c>=0?r[c]:'';const yeni=[],atla=[],uyari=[],yeniSube=new Set();const gorulen=new Set(),gTc=new Set();
  OAKT.rows.slice(OAKT.start).forEach(r=>{let ad=h(r,m.ad);if(m.soyad>=0)ad=(ad+' '+h(r,m.soyad)).trim();ad=ad.replace(/\s+/g,' ');if(!ad)return;
    const no=h(r,m.no).replace(/\.0$/,'');const sb=h(r,m.sube)||OAKT.varsayilanSube||'';if(no&&noSahibi(no)&&!S.ogrenciler.some(o=>String(o.no)===no)){atla.push(ad+` (${no} numarası arşivdeki bir öğrencide)`);return}const anahtar=no||adAnahtar(ad)+'|'+norm(sb);

  return f&&f.data?`<img class="av" src="${f.data}" alt="" style="width:${size}px;height:${size}px">`:`<span class="av ini" style="width:${size}px;height:${size}px;font-size:${Math.max(10,Math.round(size*0.38))}px">${esc(ini)}</span>`}
function resimKucult(file,max,kare){return new Promise((ok,no)=>{if(!/^image\//.test(file.type||'image/')){no(new Error('Resim dosyası seç (jpg, png)'));return}
  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h;
    if(kare){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=max}else{const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r)}
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(kare){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,sx,sy,sw,sh,0,0,w,h);
    ok(kare?c.toDataURL('image/jpeg',0.82):c.toDataURL('image/png'))};im.onerror=()=>no(new Error('Resim okunamadı'));im.src=fr.result};
  fr.onerror=()=>no(new Error('Dosya okunamadı'));fr.readAsDataURL(file)})}
const logoHtml=(h=28)=>S&&S.ayarlar&&S.ayarlar.logo?`<img src="${S.ayarlar.logo}" alt="" style="height:${h}px;max-width:${h*4}px;object-fit:contain;vertical-align:middle">`:'';

function noUyari(no,haric){const o=noSahibi(no,haric);return o?`${esc(String(no).trim())} numarası ${esc(o.ad)}'da (${o.arsiv?'arşivde, '+esc(o.arsiv.yil||''):esc(sube(o.subeId).ad)})`:''}
function siradakiNo(ek=[]){const kul=new Set([...tumOgr().map(o=>String(o.no||'').trim()),...ek].filter(Boolean));
  if(S.ayarlar.noKural==='yil'){const t=D(TODAY);const y=String((t.getMonth()>=7?t.getFullYear():t.getFullYear()-1)%100).padStart(2,'0');let i=1;while(kul.has(y+String(i).padStart(3,'0')))i++;return y+String(i).padStart(3,'0')}
  const nums=[...kul].filter(x=>/^\d{1,9}$/.test(x)).map(Number);let n=nums.length?Math.max(...nums)+1:(+S.ayarlar.noBas||101);while(kul.has(String(n)))n++;return String(n)}

  </div>`}
const cbRaw=n=>`<input type="checkbox" name="${esc(n)}">`;
function hedefCoz(f){const K=new Set(),ad=[];const ogrs=S.ogrenciler,ogts=S.ogretmenler;
  const addO=l=>l.forEach(o=>K.add('ogrenci:'+o.id));const addV=l=>l.forEach(o=>veliKeys(o).forEach(k=>K.add(k)));const addT=l=>l.forEach(t=>{const k=ogtKey(t);if(k)K.add(k)});
  if(f.h_hepsi){addO(ogrs);addV(ogrs);addT(ogts);yonetimKeys().forEach(k=>K.add(k));ad.push('Herkes')}
  if(f.h_r_ogretmen){addT(ogts.filter(t=>!t.rehber));ad.push('Öğretmenler')}
  if(f.h_r_rehber){addT(ogts.filter(t=>t.rehber));ad.push('Rehberlik')}
  if(f.h_r_yonetici){yonetimKeys().forEach(k=>K.add(k));ad.push('Yönetim')}
  if(f.h_r_ogrenci){addO(ogrs);ad.push('Öğrenciler')}
  if(f.h_r_veli){addV(ogrs);ad.push('Veliler')}
  Object.keys(f).forEach(n=>{let m;
    if((m=n.match(/^h_z_(.+)$/))){addT(ogts.filter(t=>!t.rehber&&t.brans===m[1]));ad.push(m[1]+' zümresi')}
    else if((m=n.match(/^h_k_(YKS|LGS)_([ov])$/))){const l=ogrs.filter(o=>sube(o.subeId).kademe===m[1]);m[2]==='o'?addO(l):addV(l);ad.push(m[1]+(m[2]==='o'?' öğrencileri':' velileri'))}
    else if((m=n.match(/^h_s_(.+)_([ovt])$/))){const sid=m[1];const l=ogrs.filter(o=>o.subeId===sid);if(m[2]==='o')addO(l);else if(m[2]==='v')addV(l);else addT([...new Set(S.dersler.filter(d=>d.subeId===sid).map(d=>d.ogretmenId))].map(id=>S.ogretmenler.find(t=>t.id===id)).filter(Boolean));ad.push(sube(sid).ad+(m[2]==='o'?' öğrencileri':m[2]==='v'?' velileri':' öğretmenleri'))}
    else if((m=n.match(/^h_p_(.+)$/))){K.add(m[1]);ad.push(keyAd(m[1]).split(' · ')[0])}});
  return {keys:[...K],ad:ad.length>4?ad.slice(0,4).join(', ')+` +${ad.length-4}`:ad.join(', ')}}

/* mesaj grupları */
const grupUye=g=>anahtarlarim().some(k=>(g.uyeler||[]).includes(k));
const grupYon=g=>O.role==='yonetici'||anahtarlarim().some(k=>(g.yoneticiler||[]).includes(k));
const gruplarim=()=>S.gruplar.filter(g=>!g.pasif&&(grupUye(g)||O.role==='yonetici'));
const grupOkuKey=()=>'dershane.grupOkuma:'+ME();
function grupOkuma(){try{return JSON.parse(ls.get(grupOkuKey())||'{}')||{}}catch(e){return {}}}
const grupOkunmamis=g=>{const t=grupOkuma()[g.id]||'';return S.grup_mesajlari.filter(m=>m.grupId===g.id&&m.zaman>t&&!benim(m.from)).length};
const unreadGrup=()=>S.gruplar.filter(g=>!g.pasif&&grupUye(g)).reduce((a,g)=>a+grupOkunmamis(g),0);
function otoGruplar(){let ch=false;const yon=yonetimKeys();const reh=S.ogretmenler.filter(t=>t.rehber).map(ogtKey);const ben=O?ME():'yonetici:y1';const istenen=[];
  zumreler().forEach(z=>istenen.push({oto:'zumre:'+z,ad:z+' zümresi',uyeler:[...S.ogretmenler.filter(t=>!t.rehber&&t.brans===z).map(ogtKey),...yon],yoneticiler:yon,sadeceYonetici:false}));
  S.subeler.forEach(s=>{const ogs=S.ogrenciler.filter(o=>o.subeId===s.id);const ogts=[...new Set(S.dersler.filter(d=>d.subeId===s.id).map(d=>d.ogretmenId))].map(id=>S.ogretmenler.find(t=>t.id===id)).filter(Boolean).map(ogtKey);
    istenen.push({oto:'sube:'+s.id,ad:s.ad+' sınıfı',uyeler:[...ogs.map(o=>'ogrenci:'+o.id),...ogts,...reh,...yon],yoneticiler:[...ogts,...reh,...yon],sadeceYonetici:false});
    istenen.push({oto:'veli:'+s.id,ad:s.ad+' velileri',uyeler:[...ogs.flatMap(veliKeys),...ogts,...reh,...yon],yoneticiler:[...ogts,...reh,...yon],sadeceYonetici:true})});
  if(S.ogretmenler.length)istenen.push({oto:'ogretmenler',ad:'Öğretmenler odası',uyeler:[...S.ogretmenler.map(ogtKey),...yon],yoneticiler:yon,sadeceYonetici:false});
  istenen.forEach(x=>{const g=S.gruplar.find(y=>y.oto===x.oto);const uy=[...new Set(x.uyeler.filter(Boolean))].sort();
    if(!g){if(x.oto.startsWith('sube:')&&!uy.some(k=>k.startsWith('ogrenci:')))return;if(x.oto.startsWith('veli:')&&!uy.some(k=>k.startsWith('veli:')))return;
      S.gruplar.push({id:'g'+uid(),oto:x.oto,ad:x.ad,uyeler:uy,yoneticiler:[...new Set(x.yoneticiler.filter(Boolean))].sort(),sadeceYonetici:x.sadeceYonetici,olusturan:ben,tarih:TODAY});ch=true;return}
    const hedef=[...new Set([...uy,...(g.ekUyeler||[])])].filter(k=>!(g.cikarilan||[]).includes(k)).sort();
    if(stab(hedef)!==stab([...(g.uyeler||[])].sort())){g.uyeler=hedef;ch=true}
    const yh=[...new Set([...x.yoneticiler.filter(Boolean),...(g.ekYoneticiler||[])])].sort();if(stab(yh)!==stab([...(g.yoneticiler||[])].sort())){g.yoneticiler=yh;ch=true}
    if(g.pasif){delete g.pasif;ch=true}});
  S.gruplar.filter(g=>g.oto&&!g.pasif&&!istenen.some(x=>x.oto===g.oto)).forEach(g=>{g.pasif=true;ch=true});
  return ch}

const GDUR={bekliyor:['n','Bekliyor'],hazirlaniyor:['acc','Hazırlanıyor'],onayda:['warn','Onay bekliyor'],onaylandi:['ok','Onaylandı'],duzeltme:['bad','Düzeltme istendi']};
const gdurTag=d=>`<span class="tag ${(GDUR[d]||GDUR.bekliyor)[0]}">${(GDUR[d]||GDUR.bekliyor)[1]}</span>`;
const gorevlerim=()=>S.gorevler.filter(g=>benim(g.atanan));
const unreadGorev=()=>gorevlerim().filter(g=>['bekliyor','duzeltme'].includes(g.durum)).length;
const gorevVerebilir=()=>['yonetici','rehber'].includes(O.role);

const donemBas=()=>S.ayarlar.donemBas||egitimYili().slice(0,4)+'-09-08';
let buHafta=()=>Math.max(1,Math.floor(daysBetween(weekStart(donemBas()),TODAY)/7)+1);
const SINIFLAR=['5','6','7','8','9','10','11','12','Mezun'];
const mufYetki=m=>['yonetici','rehber'].includes(O.role)||S.gorevler.some(g=>g.mufredatId===m.id&&benim(g.atanan)&&['bekliyor','hazirlaniyor','duzeltme'].includes(g.durum));
const mufSubeler=m=>S.subeler.filter(s=>sinifOf(s.id)===String(m.sinif)&&S.dersler.some(d=>d.subeId===s.id&&norm(d.ders)===norm(m.ders)));
const mufBul=(ders,subeId)=>S.mufredat.find(m=>norm(m.ders)===norm(ders)&&String(m.sinif)===sinifOf(subeId));
function mufIlerleme(m,subeId){const k=[...m.konular].sort((a,b)=>(+a.hafta||0)-(+b.hafta||0));const isl=new Set(S.islenen.filter(x=>x.mufredatId===m.id&&x.subeId===subeId).map(x=>x.konuId));
  const n=k.filter(x=>isl.has(x.id)).length;const plan=k.filter(x=>(+x.hafta||0)<=buHafta()).length;const kalan=k.filter(x=>!isl.has(x.id));
  const geri=kalan.length&&n<plan?Math.max(0,buHafta()-(+kalan[0].hafta||0)):0;return {n,top:k.length,plan,geri,yuzde:k.length?Math.round(n/k.length*100):0}}
function ilerlemeSatir(m,sid){const p=mufIlerleme(m,sid);return `<div class="row" style="gap:8px;flex-wrap:nowrap"><span style="min-width:48px" class="small"><b>${esc(sube(sid).ad)}</b></span><div class="bar" style="flex:1;min-width:80px"><i style="width:${p.yuzde}%"></i></div><span class="small" style="white-space:nowrap">%${p.yuzde} · ${p.geri?`<span style="color:var(--bad)">${p.geri} hafta geride</span>`:p.n>=p.plan?'planda':'—'}</span></div>`}

/* konu analizi */
function konuStat(r,s){const KM=r&&r.cev&&s.anahtar?konuMapOf(s):null;if(!KM)return null;const t=turOf(s);const kit=r.cev.kit||'A';const key=s.anahtar[kit]||(kit==='A'?null:null)||s.anahtar.A;const km=KM[kit];if(!key||!km)return null;
  const out={};let p=0;t.dersler.forEach(([d,q])=>{const L=km[d]||[];for(let i=0;i<q;i++,p++){const konu=L[i];if(!konu)continue;const k=key[p]||' ',a=r.cev.s[p]||' ';
    const o=out[d+'|'+konu]=out[d+'|'+konu]||{ders:d,konu,d:0,y:0,b:0,t:0};o.t++;if(k==='X'||k==='*'){o.d++;continue}if(!/[A-E]/.test(a))o.b++;else if(a===k)o.d++;else o.y++}});return out}
function konuOzet(s,ogrIds){const top={};S.sonuclar.filter(r=>r.sinavId===s.id&&(!ogrIds||ogrIds.includes(r.ogrId))).forEach(r=>{const st=konuStat(r,s);if(!st)return;
  Object.values(st).forEach(x=>{const o=top[x.ders+'|'+x.konu]=top[x.ders+'|'+x.konu]||{ders:x.ders,konu:x.konu,d:0,y:0,b:0,t:0,n:0};o.d+=x.d;o.y+=x.y;o.b+=x.b;o.t+=x.t;o.n++})});
  return Object.values(top).map(o=>({...o,oran:o.t?o.d/o.t:0})).sort((a,b)=>a.oran-b.oran)}
const yuzdeTag=o=>`<span class="tag ${o<0.4?'bad':o<0.6?'warn':'ok'}">%${Math.round(o*100)}</span>`;
function konuParse(txt,q){const out=new Array(q).fill('');let i=0;String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{
  const m=l.match(/^(\d+)\s*(?:-\s*(\d+))?\s*[:.)\-–]?\s+(.+)$/);if(m){const a=+m[1],b=m[2]?+m[2]:a;for(let k=a;k<=b&&k<=q;k++)out[k-1]=m[3].trim();i=b}else{if(i<q)out[i++]=l}});return out}
function konuYaz(arr){const out=[];let i=0;while(i<arr.length){if(!arr[i]){i++;continue}let j=i;while(j+1<arr.length&&arr[j+1]===arr[i])j++;out.push((j>i?`${i+1}-${j+1}`:`${i+1}`)+' '+arr[i]);i=j+1}return out.join('\n')}

/* ders durumu ve yoklama takibi */
const DDUR={basladi:['ok','Başladı'],ertelendi:['warn','Ertelendi'],iptal:['bad','İptal'],degisti:['acc','Öğretmen değişti']};
const dersDurum=(dersId,tarih=TODAY)=>S.ders_durum.find(x=>x.id===dersId+'_'+tarih);
function dersBilgi(d,tarih=TODAY){const dd=dersDurum(d.id,tarih);return {dd,saat:(dd&&dd.durum==='ertelendi'&&dd.yeniSaat)||d.saat,ogretmenId:(dd&&dd.durum==='degisti'&&dd.yeniOgretmenId)||d.ogretmenId,iptal:!!(dd&&dd.durum==='iptal')}}
function ddTag(d,tarih=TODAY){const dd=dersDurum(d.id,tarih);if(!dd)return '';const t=DDUR[dd.durum];return `<span class="tag ${t[0]}">${t[1]}${dd.durum==='ertelendi'&&dd.yeniSaat?' → '+dd.yeniSaat:''}${dd.durum==='degisti'&&dd.yeniOgretmenId?' · '+esc(ogt(dd.yeniOgretmenId).ad):''}</span>`}
function yokDurum(d,tarih=TODAY){const b=dersBilgi(d,tarih);if(b.iptal)return {k:'iptal',tag:'<span class="tag n">İptal</span>'};
  const y=S.yoklamalar.find(x=>x.dersId===d.id&&x.tarih===tarih);if(y){const c=Object.values(y.kayit);return {k:'alindi',tag:`<span class="tag ok">● Alındı · ${c.filter(v=>v!=='yok').length}/${c.length}</span>`}}
  if(tarih<TODAY)return {k:'alinmadi',tag:'<span class="tag bad">● Alınmadı</span>'};if(tarih>TODAY)return {k:'baslamadi',tag:'<span class="tag n">Başlamadı</span>'};
  const n=simdiDk(),bas=dk(b.saat),sure=+S.ayarlar.dersSure||40;
  if(n<bas)return {k:'baslamadi',tag:'<span class="tag n">Başlamadı</span>'};if(n<bas+15)return {k:'suruyor',tag:'<span class="tag acc">Ders sürüyor</span>'};
  if(n<bas+sure)return {k:'bekleniyor',tag:'<span class="tag warn">● Yoklama bekleniyor</span>'};return {k:'alinmadi',tag:'<span class="tag bad">● Yoklama alınmadı</span>'}}
function eksikYoklamalar(gun=7,ogretmenId){const out=[];for(let i=0;i<=gun;i++){const t=addDays(TODAY,-i);S.dersler.filter(d=>d.gun===wd(t)&&(!ogretmenId||dersBilgi(d,t).ogretmenId===ogretmenId)).forEach(d=>{const y=yokDurum(d,t);if(y.k==='alinmadi'||y.k==='bekleniyor')out.push({d,t,k:y.k})})}return out.sort((a,b)=>(a.t+dersBilgi(a.d,a.t).saat)<(b.t+dersBilgi(b.d,b.t).saat)?1:-1)}
const ogrBugunSatir=(d,ogrId)=>{const b=dersBilgi(d);const y=S.yoklamalar.find(x=>x.dersId===d.id&&x.tarih===TODAY);const st=y&&ogrId&&y.kayit[ogrId];return `<tr><td><b>${b.saat}</b>${b.saat!==d.saat?` <s class="muted small">${d.saat}</s>`:''}</td><td>${esc(d.ders)} ${ddTag(d)}</td><td class="muted">${esc(ogt(b.ogretmenId).ad)}</td>${ogrId!==undefined?`<td class="num">${b.iptal?'':st?`<span class="tag ${ST[st][0]}">${ST[st][1]}</span>`:'<span class="tag n">Yoklama bekleniyor</span>'}</td>`:''}</tr>`};

/* etüt çakışma kontrolü */
function etutUyari(e,ogrIds){const u=[];const sure=+S.ayarlar.dersSure||40;const eb=dk(e.saat),es=eb+(+e.sure||30);
  if(ogrIds.length>e.kontenjan)u.push(`Kontenjan ${e.kontenjan}, ${ogrIds.length} öğrenci seçildi.`);
  ogrIds.forEach(id=>{const o=ogr(id);
    S.etutler.filter(x=>x.id!==e.id&&x.tarih===e.tarih&&x.ogr.includes(id)&&Math.abs(dk(x.saat)-eb)<Math.max(+x.sure||30,+e.sure||30)).forEach(x=>u.push(`${o.ad}: aynı saatte ${ogt(x.ogretmenId).ad} etüdünde.`));
    S.dersler.filter(d=>d.subeId===o.subeId&&d.gun===wd(e.tarih)).forEach(d=>{const b=dersBilgi(d,e.tarih);if(b.iptal)return;const db=dk(b.saat);if(db<es&&eb<db+sure)u.push(`${o.ad}: ${b.saat} ${d.ders} dersiyle çakışıyor.`)})});
  return [...new Set(u)]}

AFTER.bildirimler=()=>{ls.set(okumaKey(),nowTime());document.querySelectorAll('[data-page="bildirimler"] .cnt').forEach(e=>e.remove())};

/* Görevler */
PAGES.gorevler=arg=>{
  if(arg)return gorevDetay(arg);
  const f=O.f_gtab||'bana';const verir=gorevVerebilir();
  let l=f==='bana'?gorevlerim():f==='verdigim'?S.gorevler.filter(g=>benim(g.veren)):S.gorevler;
  l=[...l].sort((a,b)=>(a.durum==='onaylandi')-(b.durum==='onaylandi')||(a.sonTarih||'9')<(b.sonTarih||'9')?-1:1);
  const tabs=[['bana','Bana verilenler'],...(verir?[['verdigim','Verdiklerim']]:[]),...(O.role==='yonetici'?[['tumu','Tümü']]:[])];
  return head('Görevler',`${gorevlerim().filter(g=>g.durum!=='onaylandi').length} açık görevin var`,verir?`<button class="btn primary" data-act="gorev-yeni">Görev ver</button>`:'')+
  `<div class="card flush"><div class="row" style="padding:14px 16px;border-bottom:1px solid var(--line2)"><div class="seg">${tabs.map(([k,t])=>`<button class="${f===k?'on':''}" data-act="fgtab" data-v="${k}">${t}</button>`).join('')}</div></div>
  <div class="tw"><table><tr><th>Görev</th><th>Sorumlu</th><th>Veren</th><th>Son tarih</th><th>Durum</th></tr>${l.map(g=>{const gec=g.sonTarih&&g.sonTarih<TODAY&&g.durum!=='onaylandi';return `<tr class="click" data-act="go" data-page="gorevler:${g.id}"><td><b>${esc(g.baslik)}</b>${g.tur==='mufredat'?' <span class="tag acc">Yıllık plan</span>':''}</td><td>${esc(keyAd(g.atanan).split(' · ')[0])}</td><td class="muted">${esc(keyAd(g.veren).split(' · ')[0])}</td><td>${g.sonTarih?fd(g.sonTarih):'—'}${gec?' <span class="tag bad">Gecikti</span>':g.sonTarih&&g.durum!=='onaylandi'&&daysBetween(TODAY,g.sonTarih)<=3?' <span class="tag warn">Yaklaşıyor</span>':''}</td><td>${gdurTag(g.durum)}</td></tr>`}).join('')||`<tr><td colspan="5">${empty('Görev yok.')}</td></tr>`}</table></div></div>`};
function gorevDetay(id){const g=S.gorevler.find(x=>x.id===id);if(!g)return `<a href="#" class="back" data-act="go" data-page="gorevler">← Görevler</a>`+empty('Görev bulunamadı.');
  const ben=benim(g.atanan),veren=benim(g.veren)||O.role==='yonetici';const m=g.mufredatId&&S.mufredat.find(x=>x.id===g.mufredatId);
  const b=[];
  if(ben&&['bekliyor','duzeltme'].includes(g.durum))b.push(`<button class="btn" data-act="gorev-dur" data-id="${id}" data-v="hazirlaniyor">Başladım</button>`);
  if(ben&&['bekliyor','hazirlaniyor','duzeltme'].includes(g.durum))b.push(`<button class="btn primary" data-act="gorev-dur" data-id="${id}" data-v="onayda">Tamamladım, onaya gönder</button>`);
  if(veren&&g.durum==='onayda'){b.push(`<button class="btn primary" data-act="gorev-dur" data-id="${id}" data-v="onaylandi">Onayla</button>`);b.push(`<button class="btn" data-act="gorev-duzelt" data-id="${id}">Düzeltme iste</button>`)}
  if(veren)b.push(`<button class="btn danger" data-act="gorev-sil" data-id="${id}">Sil</button>`);
  return `<a href="#" class="back" data-act="go" data-page="gorevler">← Görevler</a>`+head(esc(g.baslik),`${esc(keyAd(g.veren).split(' · ')[0])} → ${esc(keyAd(g.atanan).split(' · ')[0])}${g.sonTarih?' · son tarih '+fd(g.sonTarih):''}`,gdurTag(g.durum)+b.join(''))+
  `<div class="grid2"><div class="card"><h2>Açıklama</h2><p>${esc(g.aciklama||'—')}</p>${m?`<div class="note" style="margin-top:10px"><b>${esc(m.sinif)}. sınıf ${esc(m.ders)} yıllık planı</b> · ${m.konular.length} konu<br><a href="#" data-act="go" data-page="mufredat:${m.id}">Yıllık planı aç${ben&&mufYetki(m)?' ve düzenle':''} →</a></div>`:''}</div>
  <div class="card"><h2>Notlar</h2>${(g.notlar||[]).map(n=>`<p><span class="small muted">${esc(keyAd(n.k).split(' · ')[0])} · ${ftime(n.zaman)}</span><br>${esc(n.metin)}</p>`).join('')||empty('Not yok.')}
  <form data-form="gorevnot" data-id="${id}" class="row" style="flex-wrap:nowrap;margin-top:8px"><input name="metin" placeholder="Not ekle" required><button class="btn" type="submit">Ekle</button></form></div></div>`}

/* Müfredat */
PAGES.mufredat=arg=>{
  if(arg)return mufDetay(arg);
  const yon=['yonetici','rehber'].includes(O.role);const l=[...S.mufredat].sort((a,b)=>(a.ders+a.sinif).localeCompare(b.ders+b.sinif,'tr'));
  return head('Yıllık plan',`${egitimYili()} · ${buHafta()}. ders haftası (${haftaEtiket(buHafta())})`,yon?`<button class="btn" data-act="gorev-yeni" data-tur="mufredat">Görev olarak ver</button><button class="btn primary" data-act="muf-yeni">Yıllık plan ekle</button>`:'')+
  `<div class="card flush"><div class="tw"><table><tr><th>Ders</th><th>Sınıf</th><th class="num">Konu</th><th>Hazırlayan</th><th>Durum</th><th style="width:34%">İlerleme</th></tr>${l.map(m=>{const g=S.gorevler.find(x=>x.mufredatId===m.id);const ss=mufSubeler(m);
    return `<tr class="click" data-act="go" data-page="mufredat:${m.id}"><td><b>${esc(m.ders)}</b></td><td>${esc(m.sinif)}${m.sinif==='Mezun'?'':'. sınıf'}</td><td class="num">${m.konular.length}</td><td class="muted">${g?esc(keyAd(g.atanan).split(' · ')[0]):'—'}</td><td>${m.durum==='onayli'?'<span class="tag ok">Onaylı</span>':g?gdurTag(g.durum):'<span class="tag n">Taslak</span>'}</td><td>${ss.length&&m.konular.length?ss.map(s=>ilerlemeSatir(m,s.id)).join(''):'<span class="small muted">—</span>'}</td></tr>`}).join('')||`<tr><td colspan="6">${empty('Henüz yıllık plan yok. “Görev olarak ver” ile bir öğretmene hazırlatabilirsin.')}</td></tr>`}</table></div></div>`};
function mufDetay(id){const m=S.mufredat.find(x=>x.id===id);if(!m)return `<a href="#" class="back" data-act="go" data-page="mufredat">← Yıllık plan</a>`+empty('Yıllık plan bulunamadı.');
  const yetki=mufYetki(m);const k=[...m.konular].sort((a,b)=>(+a.hafta||0)-(+b.hafta||0));
  const subs=mufSubeler(m).filter(s=>O.role!=='ogretmen'||S.dersler.some(d=>d.subeId===s.id&&d.ogretmenId===O.id));const fs=subs.some(s=>s.id===O.f_msube)?O.f_msube:(subs[0]||{}).id;
  let h=`<a href="#" class="back" data-act="go" data-page="mufredat">← Yıllık plan</a>`+head(`${esc(m.sinif)}${m.sinif==='Mezun'?'':'. sınıf'} ${esc(m.ders)}`,`${esc(m.yil||'')} · ${m.konular.length} konu · bu hafta ${buHafta()}. ders haftası (${haftaEtiket(buHafta())})`,
    `<div class="seg"><button class="${O.f_mplan!=='takvim'?'on':''}" data-act="fmplan" data-v="liste">Liste</button><button class="${O.f_mplan==='takvim'?'on':''}" data-act="fmplan" data-v="takvim">Takvim</button></div><button class="btn" data-act="muf-excel" data-id="${id}">Excel</button>`+(yetki?`<button class="btn" data-act="muf-aktar" data-id="${id}">Excel'den aktar</button>`:'')+(['yonetici','rehber'].includes(O.role)?`<button class="btn danger" data-act="muf-sil" data-id="${id}">Sil</button>`:''));
  if(O.f_mplan==='takvim')return h+(S.etkinlikler.some(e=>e.tur==='tatil')?'':`<div class="banner">Takvimde tatil yok; haftalar tatiller düşülmeden hesaplanıyor. Takvim sayfasından “MEB takvimini ekle”ye bas.</div>`)+planTakvim(m);
  if(yetki)h+=`<div class="card"><div class="between"><h2 style="margin:0">Konular</h2><span class="small muted">Hafta: eğitim yılının kaçıncı ders haftası (tatiller sayılmaz) · tarihler takvimden hesaplanır</span></div>
    <form data-form="mufredat" data-id="${id}"><div class="tw"><table id="muf-t"><tr><th style="width:80px">Hafta</th><th>Ünite</th><th>Konu</th><th style="width:80px">Saat</th><th></th></tr>
    ${(k.length?k:[{id:'',hafta:'',unite:'',konu:'',saat:''}]).map(x=>mufSatir(x)).join('')}</table></div>
    <div class="row" style="margin-top:10px"><button class="btn" type="button" data-act="muf-satir">Satır ekle</button><button class="btn primary" type="submit">Kaydet</button></div></form></div>`;
  else h+=`<div class="card flush"><div class="tw"><table><tr><th>Hafta</th><th>Ünite</th><th>Konu</th><th class="num">Saat</th></tr>${k.map(x=>`<tr><td><b>${esc(x.hafta)}</b> <span class="small muted">${x.hafta?haftaEtiket(x.hafta):''}</span></td><td class="muted">${esc(x.unite)}</td><td>${esc(x.konu)}</td><td class="num">${esc(x.saat)}</td></tr>`).join('')||`<tr><td colspan="4">${empty('Konu girilmemiş.')}</td></tr>`}</table></div></div>`;
  const tum=mufSubeler(m);
  if(tum.length&&k.length){h+=`<div class="card"><h2>Şubelerde ilerleme</h2>${tum.map(s=>ilerlemeSatir(m,s.id)).join('')}</div>`;
    if(subs.length){const isl=new Map(S.islenen.filter(x=>x.mufredatId===id&&x.subeId===fs).map(x=>[x.konuId,x]));
      h+=`<div class="card flush"><div class="between" style="padding:16px 18px 0"><h2>İşlenen konular</h2><div class="seg">${subs.map(s=>`<button class="${s.id===fs?'on':''}" data-act="fmsube" data-v="${s.id}">${esc(s.ad)}</button>`).join('')}</div></div>
      <div class="tw"><table><tr><th>Hafta</th><th>Konu</th><th>Durum</th></tr>${k.map(x=>{const i=isl.get(x.id);const plan=(+x.hafta||0)<=buHafta();return `<tr><td><b>${esc(x.hafta)}</b> <span class="small muted">${x.hafta?haftaEtiket(x.hafta):''}</span></td><td>${esc(x.konu)} <span class="small muted">${esc(x.unite)}</span></td><td><button class="btn sm ${i?'':'primary'}" data-act="isle" data-m="${id}" data-k="${x.id}" data-s="${fs}">${i?'✓ İşlendi · '+fds(i.tarih):'İşlendi olarak işaretle'}</button>${!i&&plan?' <span class="tag warn">Planda geçti</span>':''}</td></tr>`}).join('')}</table></div></div>`}}
  return h}
const mufSatir=x=>`<tr data-k="${esc(x.id||'')}"><td style="white-space:nowrap"><input name="hafta" value="${esc(x.hafta||'')}" inputmode="numeric" style="width:56px"> <span class="small muted">${x.hafta?haftaEtiket(x.hafta):''}</span></td><td><input name="unite" value="${esc(x.unite||'')}"></td><td><input name="konu" value="${esc(x.konu||'')}"></td><td><input name="saat" value="${esc(x.saat||'')}" inputmode="numeric" style="width:64px"></td><td><button class="link" type="button" data-act="muf-satir-sil">Sil</button></td></tr>`;

/* Etüt planı (rehber) */
PAGES.etutplan=()=>{
  const ft=O.f_ogt||'';const up=S.etutler.filter(e=>e.tarih>=TODAY&&e.tarih<=addDays(TODAY,14)&&(!ft||e.ogretmenId===ft)).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);const gunler=[...new Set(up.map(e=>e.tarih))];
  const tl_=S.talepler.filter(t=>t.durum==='acik').sort((a,b)=>a.tarih<b.tarih?-1:1);
  return head('Etüt planı','Etüt oluştur ya da öğretmenlerin açtığı saatlere öğrenci ata',`<button class="btn primary" data-act="etut-olustur">Etüt oluştur</button>`+`<select class="inline-sel" data-chg="fogt">${opt('','Tüm öğretmenler',ft)}${S.ogretmenler.filter(t=>!t.rehber).map(t=>opt(t.id,t.ad+' · '+t.brans,ft)).join('')}</select>`)+
  (tl_.length?`<div class="card flush"><h2>Etüt talepleri (${tl_.length})</h2><div class="tw"><table>${tl_.map(t=>`<tr><td>${av('ogrenci:'+t.ogrId,ogr(t.ogrId).ad,26)} <b>${esc(ogr(t.ogrId).ad)}</b> <span class="small muted">${esc(sube(ogr(t.ogrId).subeId).ad)}</span></td><td><span class="tag acc">${esc(t.ders)}</span></td><td class="small">${esc(t.not)}</td><td class="small muted">${fds(t.tarih)}</td><td class="num"><div class="row" style="justify-content:flex-end"><button class="btn sm primary" data-act="talep-ata" data-id="${t.id}">Saat seç</button><button class="btn sm" data-act="talep-kapat" data-id="${t.id}">Kapat</button></div></td></tr>`).join('')}</table></div></div>`:'')+
  (gunler.map(g=>`<div class="card"><h3>${GUN[wd(g)]}, ${fd(g)}</h3><table>${up.filter(e=>e.tarih===g).map(e=>{const dol=e.ogr.length>=e.kontenjan;return `<tr><td style="width:70px"><b>${e.saat}</b>${e.sure?`<br><span class="small muted">${e.sure} dk</span>`:''}</td><td style="width:30%">${esc(ogt(e.ogretmenId).ad)} <span class="small muted">${esc(ogt(e.ogretmenId).brans)}</span></td><td>${e.ogr.map(i=>`<span class="chip">${esc(ogr(i).ad)} <button class="link" data-act="etut-cikar" data-id="${e.id}" data-ogr="${i}" title="Çıkar">×</button></span>`).join(' ')||'<span class="muted small">Boş</span>'}</td><td class="small muted num">${e.ogr.length}/${e.kontenjan}</td><td class="num"><button class="btn sm ${dol?'':'primary'}" data-act="etut-ata" data-id="${e.id}">Öğrenci ata</button></td></tr>`}).join('')}</table></div>`).join('')||`<div class="card">${empty('Önümüzdeki 14 günde açık etüt saati yok. Öğretmenler “Etüt saatlerim” sayfasından saat açar.')}</div>`)};
function etutAtaModal(eid,secili,talepId,uyarilar){const e=S.etutler.find(x=>x.id===eid);if(!e){toast('Etüt bulunamadı');return}
  const son=S.sinavlar.filter(s=>s.yayinda&&konuMapOf(s)).sort((a,b)=>a.tarih<b.tarih?1:-1)[0];const konular=son?konuOzet(son).slice(0,20):[];
  const sec=new Set(secili||e.ogr);const fs=O.f_esube||'';
  modal(`Etüde öğrenci ata · ${GUN[wd(e.tarih)]} ${fds(e.tarih)} ${e.saat}`,`<p class="small muted">${esc(ogt(e.ogretmenId).ad)} · ${esc(ogt(e.ogretmenId).brans)} · kontenjan ${e.kontenjan}</p>
  ${uyarilar&&uyarilar.length?`<div class="banner"><b>Dikkat:</b><ul style="margin:4px 0 0;padding-left:18px">${uyarilar.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></div>`:''}
  <form data-form="etutata" data-id="${eid}" data-talep="${esc(talepId||'')}">${uyarilar&&uyarilar.length?'<input type="hidden" name="zorla" value="1">':''}
  <div class="row" style="margin-bottom:8px"><select class="inline-sel" data-chg="esube">${opt('','Tüm şubeler',fs)}${S.subeler.map(s=>opt(s.id,s.ad,fs)).join('')}</select>
  ${konular.length?`<select class="inline-sel" data-chg="ekonu"><option value="">Zayıf konuya göre seç (${esc(son.ad)})…</option>${konular.map(k=>`<option value="${esc(k.ders+'|'+k.konu)}">${esc(k.ders)} · ${esc(k.konu)} (%${Math.round(k.oran*100)})</option>`).join('')}</select>`:''}
  <input placeholder="İsim ara" data-filter="#ea-l label" style="max-width:180px"></div>
  <div id="ea-l" class="hk" style="max-height:300px">${S.ogrenciler.filter(o=>!fs||o.subeId===fs||sec.has(o.id)).sort(subeSirali).map(o=>`<label class="chk">${`<input type="checkbox" name="o_${o.id}" ${sec.has(o.id)?'checked':''}>`} ${esc(o.ad)} <span class="small muted">${esc(sube(o.subeId).ad)}</span></label>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">${uyarilar&&uyarilar.length?'Yine de ata':'Kaydet'}</button><span class="small muted">Atanan öğrenciye ve velisine bildirim gider.</span></div></form>`)}

/* Öğrenci: etütlerim ve talep */
PAGES.etutlerim=()=>{const up=S.etutler.filter(e=>e.ogr.includes(O.id)&&e.tarih>=TODAY).sort((a,b)=>(a.tarih+a.saat)<(b.tarih+b.saat)?-1:1);const tl_=S.talepler.filter(t=>t.ogrId===O.id).sort((a,b)=>a.tarih<b.tarih?1:-1).slice(0,8);
  return head('Etütlerim','Etütlerini rehber öğretmenin planlar.',S.ayarlar.etutTalep!==false?`<button class="btn primary" data-act="talep-yeni">Etüt talep et</button>`:'')+
  `<div class="card"><h2>Yaklaşan etütler</h2>${up.length?`<table>${up.map(e=>`<tr><td>${GUN[wd(e.tarih)]} ${fds(e.tarih)}, <b>${e.saat}</b></td><td>${esc(ogt(e.ogretmenId).brans)}</td><td class="muted">${esc(ogt(e.ogretmenId).ad)}</td></tr>`).join('')}</table>`:empty('Planlanmış etüdün yok.')}</div>
  ${tl_.length?`<div class="card"><h2>Taleplerim</h2><table>${tl_.map(t=>`<tr><td>${fds(t.tarih)}</td><td><b>${esc(t.ders)}</b></td><td class="small">${esc(t.not)}</td><td>${t.durum==='acik'?'<span class="tag n">Bekliyor</span>':t.durum==='atandi'?'<span class="tag ok">Etüt planlandı</span>':'<span class="tag n">Kapatıldı</span>'}</td></tr>`).join('')}</table></div>`:''}`};
PAGES.etutal=PAGES.etutlerim;

/* Arşiv ve sene sonu */
PAGES.arsiv=()=>{const yil=O.f_ayil||'';const yillar=[...new Set(S.arsiv.map(o=>o.arsiv.yil))].sort().reverse();const l=S.arsiv.filter(o=>!yil||o.arsiv.yil===yil).sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
  return head('Arşiv ve mezunlar',`${S.arsiv.length} kayıt`,`<button class="btn" data-act="arsiv-excel">Excel</button><button class="btn primary" data-act="sene-sonu">Sene sonu işlemleri</button>`)+
  `<div class="card flush"><div class="row" style="padding:14px 16px;border-bottom:1px solid var(--line2)"><select class="inline-sel" data-chg="fayil">${opt('','Tüm yıllar',yil)}${yillar.map(y=>opt(y,y+' mezunları / ayrılanlar',yil)).join('')}</select><input style="max-width:240px" placeholder="İsim ya da numara ara" data-filter="#ar-t tr.click"></div>
  <div class="tw"><table id="ar-t"><tr><th>No</th><th>Öğrenci</th><th>Son şube</th><th>Yıl</th><th>Neden</th><th class="num">Son net</th><th>Yerleştiği yer</th></tr>${l.map(o=>{const ss=ogrSinavlar(o.id);const s=ss[ss.length-1];return `<tr class="click" data-act="go" data-page="ogrenciler:${o.id}"><td class="muted">${esc(o.no||'')}</td><td><b>${esc(o.ad)}</b></td><td>${esc(o.arsiv.sube||sube(o.subeId).ad)}</td><td>${esc(o.arsiv.yil)}</td><td>${esc(o.arsiv.neden)}</td><td class="num">${s?nf(toplamNet(sonucOf(s.id,o.id),s)):'—'}</td><td>${esc(o.arsiv.yerlesme||'')}</td></tr>`}).join('')||`<tr><td colspan="7">${empty('Arşiv boş. Mezun olan ya da ayrılan öğrenciler burada saklanır.')}</td></tr>`}</table></div></div>`};

/* Konu analizi kartı (deneme detayı) */
function konuKart(s){const cevVar=S.sonuclar.some(r=>r.sinavId===s.id&&r.cev);const yetki=denemeYetki();
  const kYetki=turOf(s).dersler.some(([d])=>kazanimYetki(d));
  if(!konuMapOf(s)){return kYetki?`<div class="card"><div class="between"><h2 style="margin:0">Konu analizi</h2><button class="btn sm" data-act="konu-esle" data-id="${s.id}">Kazanımları gir</button></div><p class="small muted" style="margin-top:8px">${cevVar?'Öğrenci cevapları var. Soruları konulara bağlarsan konu bazında başarı çıkar.':'Konu analizi için sonuçların optik ya da cevap dosyasıyla (öğrenci cevapları + cevap anahtarı) yüklenmesi ve soruların konulara bağlanması gerekir.'}</p></div>`:''}
  const oz=konuOzet(s);if(!oz.length)return `<div class="card"><div class="between"><h2 style="margin:0">Kazanım analizi</h2>${kYetki?`<button class="btn sm" data-act="konu-esle" data-id="${s.id}">Kazanımlar</button>`:''}</div><p class="small muted" style="margin-top:8px">Sorular konulara bağlı ama öğrenci cevabı olan sonuç yok. Sonuçları optik ya da cevap dosyasıyla yükle.</p></div>`;
  const fs=s.subeler.length>1?s.subeler:[];
  return `<div class="card flush"><div class="between" style="padding:16px 18px 0"><h2>Kazanım analizi · en çok zorlanılan konular</h2><div class="row">${kYetki?`<button class="btn sm" data-act="konu-esle" data-id="${s.id}">Kazanımlar</button>`:''}<button class="btn sm" data-act="konu-excel" data-id="${s.id}">Excel</button></div></div>

function optikTahmin(lines){const L=lines.slice(0,30);const w=Math.max(...L.map(l=>l.length));const sutun=c=>L.map(l=>l[c]||' ');
  const tip=c=>{const v=sutun(c);const n=v.length;const d=v.filter(x=>/\d/.test(x)).length,h=v.filter(x=>/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(x)).length,ae=v.filter(x=>/[A-Ea-e]/.test(x)).length,b=v.filter(x=>x===' ').length;return d>n*0.6?'d':ae>n*0.5&&h-ae<n*0.2?'c':h>n*0.3?'h':b>n*0.8?'b':'x'};
  const T=[];for(let c=0;c<w;c++)T.push(tip(c));
  let cev=-1,bos=0,kitR=null;for(let c=w-1;c>=0;c--){const v=sutun(c);if(!v.every(x=>/[A-Ea-e *\-.]/.test(x)))break;if(v.every(x=>x===' ')){bos++;if(bos>=2&&w-c>=20)break}else{bos=0;cev=c}}
  if(cev>=0&&L.length>=2){const v=sutun(cev).map(x=>x.toUpperCase());if(v.every(x=>x===v[0]&&/[A-D]/.test(x))&&T[cev+1]){kitR=[cev+1,1];cev++}}
  const runs=(t,max)=>{const r=[];let s=-1;for(let c=0;c<(max==null?w:max);c++){if(T[c]===t){if(s<0)s=c}else if(s>=0){r.push([s,c-s]);s=-1}}if(s>=0)r.push([s,(max==null?w:max)-s]);return r};
  const nos=runs('d',cev>0?cev:w).filter(x=>x[1]>=3).sort((a,b)=>b[1]-a[1]);const ads=runs('h',cev>0?cev:w);
  let adR=null;if(ads.length){const s=ads[0][0];let e=s;ads.forEach(x=>{if(x[0]-e<=3||x[0]<(nos[0]?nos[0][0]:w))e=x[0]+x[1]});adR=[s+1,e-s]}
  return {no:nos[0]?[nos[0][0]+1,Math.max(nos[0][1],Math.min(10,(adR?adR[0]-1:nos[0][0]+10)-nos[0][0]))]:null,ad_:adR,kit:kitR,cevap:cev>=0?cev+1:null}}
function optikSatirlar(lines,f,s){const t=turOf(s);const cut=(l,r)=>r&&r[0]?l.substr(r[0]-1,r[1]||1):'';const rows=[['No','Ad Soyad','Kitapçık','Cevaplar']];

/* ---------- v4.1: anlık mesaj (canlı bağlantı + hızlı arka plan yenileme) ---------- */
let CANLI=false,_sonG={},_anlikT=null,_anlikCalisiyor=false;
const ANLIK=['mesajlar','grup_mesajlari','bildirimler','randevular'];
function anlikBirlestir(t,id,veri){const ids=String(id);const eski=S[t].find(x=>String(x.id)===ids);const yeni=stab(satir(t,veri,ids));if(eski&&stab(satir(t,eski,ids))===yeni)return false;
  S[t]=S[t].filter(x=>String(x.id)!==ids);S[t].push(veri);(SNAP[t]=SNAP[t]||new Map()).set(ids,yeni);
  if(!eski){if(t==='mesajlar'&&benim(veri.to)&&!benim(veri.from)&&!(O.page==='mesajlar'&&O.f_mtab!=='grup'&&O.f_kisi===veri.from))toast(`Yeni mesaj · ${keyAd(veri.from).split(' · ')[0]}: ${String(veri.metin).slice(0,60)}`);
    if(t==='grup_mesajlari'&&!benim(veri.from)){const g=S.gruplar.find(x=>x.id===veri.grupId);if(g&&grupUye(g)&&!(O.page==='mesajlar'&&O.f_mtab==='grup'&&O.f_grup===g.id))toast(`${g.ad} · ${keyAd(veri.from).split(' · ')[0]}: ${String(veri.metin).slice(0,50)}`)}
    if(t==='bildirimler'&&benim(veri.kime||('veli:'+veri.veliId)))toast(String(veri.metin).slice(0,90))}
  return true}
async function anlikCek(){if(!ONLINE||!O||!sb||!S||_anlikCalisiyor||syncing||syncT||document.visibilityState!=='visible'||!navigator.onLine)return;_anlikCalisiyor=true;let ch=false;
  try{for(const t of ANLIK){if(GUNCELLEME6&&t==='randevular')continue;const son=_sonG[t];let q=sb.from(t).select('id,veri,guncelleme').order('guncelleme',{ascending:true}).limit(200);if(son)q=q.gt('guncelleme',new Date(new Date(son).getTime()-3000).toISOString());
      const {data,error}=await q;if(error)continue;(data||[]).forEach(r=>{if(!_sonG[t]||r.guncelleme>_sonG[t])_sonG[t]=r.guncelleme;if(anlikBirlestir(t,r.id,r.veri))ch=true})}}
  catch(e){}finally{_anlikCalisiyor=false}
  if(ch){canliRender();sekmeBaslik()}}
function sekmeBaslik(){if(!O||!S)return;const n=unreadMsg()+unreadGrup();const ad=(S.ayarlar&&S.ayarlar.kurum)||'Dershane';document.title=(n?`(${n}) `:'')+ad+' · Yönetim'}
function anlikBaslat(){clearInterval(_anlikT);_anlikT=setInterval(()=>{if(!CANLI||(Date.now()/1000|0)%30<5)anlikCek()},5000);setTimeout(anlikCek,1500)}

/* ---------- v4.1: tasarım özelleştirme ---------- */
const TEMA_RENK=[['#1F3A5F','Lacivert'],['#1F5FA8','Mavi'],['#1D5C63','Petrol'],['#2C6A44','Yeşil'],['#7A2836','Bordo'],['#B5541C','Turuncu'],['#4B3F8C','Mor'],['#3F4650','Antrasit']];
const TEMA_VARS={renk:'#1F3A5F',kose:'yumusak',yazi:'sistem',menu:'acik'};
const hexRgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return isNaN(n)?[31,58,95]:[(n>>16)&255,(n>>8)&255,n&255]};
const karis=(h,o,a)=>{const [r,g,b]=hexRgb(h),[r2,g2,b2]=hexRgb(o);const m=(x,y)=>Math.round(x*(1-a)+y*a);return '#'+[m(r,r2),m(g,g2),m(b,b2)].map(x=>x.toString(16).padStart(2,'0')).join('')};
function temaOku(){let k={};try{k=JSON.parse(ls.get('dershane.tema')||'{}')||{}}catch(e){}const t={...TEMA_VARS,...k,...((S&&S.ayarlar&&S.ayarlar.tema)||{})};return t}
function gorunumOku(){try{return {mod:'acik',boyut:'normal',...(JSON.parse(ls.get('dershane.gorunum')||'{}')||{})}}catch(e){return {mod:'acik',boyut:'normal'}}}
function temaUygula(){const t=temaOku(),g=gorunumOku();const el=document.documentElement;const koyu=g.mod==='koyu'||(g.mod==='oto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const acc=/^#[0-9a-f]{6}$/i.test(t.renk)?t.renk:'#1F3A5F';const accK=koyu?karis(acc,'#FFFFFF',0.35):acc;
  el.style.setProperty('--accent',accK);el.style.setProperty('--accent-weak',koyu?karis(acc,'#1E2228',0.72):karis(acc,'#FFFFFF',0.89));el.style.setProperty('--accent-dark',karis(acc,'#000000',0.18));
  el.dataset.kose=t.kose;el.dataset.yazi=t.yazi;el.dataset.menu=t.menu;el.dataset.koyu=koyu?'1':'0';el.dataset.boyut=g.boyut;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=koyu?'#15181C':acc;try{ls.set('dershane.tema',JSON.stringify(t))}catch(e){}}
function temaOnizle(t){return `<div class="onizle" style="--p:${t.renk}"><div class="oz-top"><b>${esc((S.ayarlar&&S.ayarlar.kurum)||'Dershane')}</b></div><div class="oz-body"><div class="oz-side ${t.menu==='koyu'?'koyu':''}"><i></i><i class="on"></i><i></i></div><div class="oz-main"><div class="oz-card"><span class="oz-btn">Kaydet</span><span class="oz-tag">Yayında</span></div></div></div></div>`}

/* Ortak karne (seçilen denemeler) */
function ortakVeri(id,ids){const ss=ids.map(i=>S.sinavlar.find(s=>s.id===i)).filter(s=>s&&sonucOf(s.id,id));if(!ss.length)return null;const s0=ss[0];const t=turOf(s0);
  const ort={};t.dersler.forEach(([d,q])=>{const l=ss.map(s=>sonucOf(s.id,id).c[d]||{d:0,y:0});ort[d]={d:l.reduce((a,c)=>a+(+c.d||0),0)/l.length,y:l.reduce((a,c)=>a+(+c.y||0),0)/l.length,n:l.reduce((a,c)=>a+dersNet(c,t.f),0)/l.length,q}});
  const tn=Object.values(ort).reduce((a,x)=>a+x.n,0);const pl=ss.map(s=>puanOf(Object.fromEntries(t.dersler.map(([d])=>[d,dersNet(sonucOf(s.id,id).c[d],t.f)])),s)).filter(x=>x!=null);const puan=pl.length?pl.reduce((a,b)=>a+b,0)/pl.length:null;
  const sr=ss.map(s=>siralar(s,id)).filter(Boolean);const ks={};let konuVar=false;
  ss.forEach(s=>{const st=konuStat(sonucOf(s.id,id),s);if(!st)return;konuVar=true;Object.values(st).forEach(x=>{const o=ks[x.ders+'|'+x.konu]=ks[x.ders+'|'+x.konu]||{ders:x.ders,konu:x.konu,d:0,y:0,b:0,t:0};o.d+=x.d;o.y+=x.y;o.b+=x.b;o.t+=x.t})});
  let onc=[];if(konuVar){onc=Object.values(ks).map(x=>{const kay=(x.y*(1+(t.f?1/t.f:0))+x.b)/ss.length;return {...x,oran:x.t?x.d/x.t:0,kazanc:kay,puan:puanArtisi(s0,x.ders,kay)}}).filter(x=>x.oran<0.75&&x.kazanc>0).sort((a,b)=>b.puan-a.puan||a.oran-b.oran).slice(0,2)}
  else onc=t.dersler.map(([d,q])=>({ders:d,konu:null,oran:ort[d].n/q,kazanc:Math.max(0,(q-ort[d].n)*0.25)})).sort((a,b)=>a.oran-b.oran).slice(0,2).map(x=>({...x,puan:puanArtisi(s0,x.ders,x.kazanc)}));
  return {ss,t,ort,tn,puan,onc,konuVar,kurum:sr.length?sr.reduce((a,x)=>a+x.kurum,0)/sr.length:null,sinif:sr.length?sr.reduce((a,x)=>a+x.sinif,0)/sr.length:null}}
function ortakHtml(id,v,yazdirma){const o=ogr(id);if(!v)return empty('Seçilen denemelerde sonucu yok.');

const FORM={
  sonuc:(f,el)=>{const id=el.dataset.id;const s=S.sinavlar.find(x=>x.id===id);const t=turOf(s);const by={};let hata='';
    Object.entries(f).forEach(([k,v])=>{const [oid,ders,kk]=k.split('|');if(v===''||v==null)return;const n=num(v);if(n==null||n<0){hata='Sayılar 0 veya daha büyük olmalı.';return}by[oid]=by[oid]||{};by[oid][ders]=by[oid][ders]||{d:0,y:0};by[oid][ders][kk]=n});
    Object.entries(by).forEach(([oid,c])=>t.dersler.forEach(([ad,q])=>{if(c[ad]&&c[ad].d+c[ad].y>q)hata=`${ogr(oid).ad} · ${ad}: doğru + yanlış ${q} soruyu geçemez.`}));
    if(hata){toast(hata);return}
